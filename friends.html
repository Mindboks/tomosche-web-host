<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Schedule List - Tomosche</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://static.line-scdn.net/liff/edge/2.1/sdk.js"></script>
    <script src="js/auth-guard.js"></script>
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
    <script src="js/escape.js"></script>
    <script src="js/template.js"></script>
    <style>
        .container.py-3 { padding: 16px 12px !important; max-width: 100% !important; }
        .friend-item {
            display: flex;
            align-items: stretch;
            padding: 12px 0;
            border-bottom: 1px solid #f0f4f8;
            gap: 12px;
            width: 100%;
        }
        .friend-item:last-child { border-bottom: none; }
        .event-date-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-width: 60px;
            flex-shrink: 0;
            background: #f8f9fa;
            border-radius: 12px;
            padding: 8px 12px;
        }
        .event-date-day { font-size: 22px; font-weight: 700; color: #333; line-height: 1.2; }
        .event-date-month { font-size: 12px; color: #888; font-weight: 600; text-transform: uppercase; }
        .event-date-time { font-size: 13px; color: #06C755; font-weight: 600; margin-top: 2px; }
        .event-info-area { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; padding: 4px 0; }
        .event-title { font-size: 16px; font-weight: 600; color: #333; line-height: 1.3; }
        .event-person { font-size: 13px; color: #888; margin-top: 2px; }
        .event-person .person-name { font-weight: 500; color: #555; }
        .event-status-badge { display: inline-block; font-size: 10px; padding: 1px 10px; border-radius: 999px; font-weight: 600; margin-top: 4px; }
        .event-status-badge.own { background: #e3f2fd; color: #1565c0; }
        .event-status-badge.shared { background: #fff3e0; color: #e65100; }
        .event-status-badge.confirmed { background: #e8f5e9; color: #2e7d32; }
        .event-actions-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            flex-shrink: 0;
            min-width: 44px;
        }
        .friend-avatar-small {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 16px;
            color: #2e7d32;
            background: #e8f5e9;
            border: 2px solid white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .friend-avatar-small.me { background: #e3f2fd; color: #1565c0; }
        .btn-delete-event {
            background: none;
            border: none;
            color: #ccc;
            font-size: 16px;
            cursor: pointer;
            padding: 4px;
            transition: all 0.2s;
            border-radius: 50%;
        }
        .btn-delete-event:hover { color: #e53935; background: rgba(229, 57, 53, 0.08); }
        .empty-state { text-align: center; padding: 48px 20px; color: #999; }
        .empty-state i { font-size: 56px; color: #ddd; display: block; margin-bottom: 16px; }
        .empty-state p { font-size: 14px; margin-bottom: 4px; }
        .empty-state .sub { font-size: 12px; color: #bbb; }
        .empty-state .btn-add {
            display: inline-block;
            margin-top: 16px;
            background: #06C755;
            color: white;
            padding: 10px 32px;
            border-radius: 999px;
            text-decoration: none;
            font-weight: 600;
        }
        .sort-bar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
        .sort-bar button {
            padding: 6px 14px;
            border-radius: 999px;
            border: 1px solid #ddd;
            background: white;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .sort-bar button.active { background: #06C755; color: white; border-color: #06C755; }
        .sort-bar button:hover:not(.active) { background: #f5f5f5; }
        .friend-count-badge {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 2px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
            margin-left: 8px;
        }
        /* モーダルスタイル */
        .schedule-modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .schedule-modal-overlay.active { display: flex; }
        .schedule-modal {
            background: white;
            border-radius: 24px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .schedule-modal h3 { font-weight: 700; margin-bottom: 4px; }
        .schedule-modal .subtitle { color: #888; font-size: 14px; margin-bottom: 20px; }
        .schedule-modal .modal-actions { display: flex; gap: 12px; margin-top: 20px; }
        .schedule-modal .modal-actions button {
            flex: 1;
            padding: 12px;
            border-radius: 999px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            font-size: 15px;
        }
        .schedule-modal .btn-cancel { background: #f0f4f8; color: #666; }
        .schedule-modal .btn-save { background: #2196f3; color: white; }
        .schedule-modal .btn-save:hover { background: #1976d2; }
        .request-item {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 10px;
            border: 1px solid #e9ecef;
        }
        .request-item:last-child { margin-bottom: 0; }
        @media (max-width: 480px) {
            .event-date-day { font-size: 18px; }
            .event-date-area { min-width: 50px; padding: 6px 8px; }
            .event-title { font-size: 14px; }
            .friend-avatar-small { width: 34px; height: 34px; font-size: 14px; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="container py-3" id="friendsContent">
            <div class="d-flex align-items-center mb-3">
                <button class="back-btn" onclick="history.back()"><i class="bi bi-arrow-left"></i></button>
                <h1 class="page-title" style="font-size:clamp(1.2rem, 4vw, 1.6rem);">Schedule List</h1>
                <span class="friend-count-badge" id="eventCount">0</span>
            </div>

            <div class="sort-bar">
                <button class="active" data-sort="date" onclick="setSort('date')">📅 Date</button>
                <button data-sort="name" onclick="setSort('name')">👤 Name</button>
                <button id="refreshBtn" onclick="loadAllData()" style="margin-left:auto;border-color:#2196f3;color:#2196f3;">🔄 Refresh</button>
            </div>

            <div id="scheduleList"></div>
        </div>
    </div>

    <!-- ✅ 友達からのイベント申請一覧モーダル -->
    <div class="schedule-modal-overlay" id="friendRequestsModal">
        <div class="schedule-modal">
            <h3>📩 Friend Event Requests</h3>
            <div class="subtitle">Event requests from your friends</div>
            <div id="friendRequestList" style="margin-top:12px;">
                <div style="text-align:center;color:#bbb;padding:20px 0;font-size:13px;">Loading requests...</div>
            </div>
            <div class="modal-actions" style="margin-top:16px;">
                <button class="btn-cancel" id="friendRequestsCloseBtn" style="width:100%;">Close</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // 変数宣言
        // ============================================================
        let allEvents = [];
        let currentSort = 'date';
        let sortDirection = 'asc';
        let currentUser = null;

        // ============================================================
        // 日付フォーマット
        // ============================================================
        function formatDateDisplay(dateStr, timeStr) {
            if (!dateStr) return { day: '--', month: '--', time: '--:--' };
            const parts = dateStr.split('-');
            if (parts.length < 3) return { day: '--', month: '--', time: '--:--' };
            const month = parseInt(parts[1], 10);
            const day = parseInt(parts[2], 10);
            let timeDisplay = '--:--';
            if (timeStr) {
                const tParts = timeStr.split(':');
                if (tParts.length >= 2) {
                    let hour = parseInt(tParts[0], 10);
                    const minute = tParts[1] || '00';
                    if (!isNaN(hour)) {
                        const ampm = hour >= 12 ? 'PM' : 'AM';
                        hour = hour % 12;
                        if (hour === 0) hour = 12;
                        timeDisplay = `${hour}:${minute} ${ampm}`;
                    }
                }
            }
            const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            return { day: String(day), month: monthNames[month - 1] || '---', time: timeDisplay };
        }

        // ============================================================
        // 時間フォーマット
        // ============================================================
        function formatTimeDisplay(timeStr) {
            if (!timeStr) return '--:--';
            const parts = timeStr.split(':');
            if (parts.length < 2) return '--:--';
            let hour = parseInt(parts[0], 10);
            const minute = parts[1] || '00';
            if (isNaN(hour)) return '--:--';
            const ampm = hour >= 12 ? 'PM' : 'AM';
            hour = hour % 12;
            if (hour === 0) hour = 12;
            return `${hour}:${minute} ${ampm}`;
        }

        // ============================================================
        // 全イベントを読み込む
        // ============================================================
        async function loadAllData() {
            const container = document.getElementById('scheduleList');
            container.innerHTML = '<div style="text-align:center;color:#bbb;padding:20px 0;">Loading...</div>';

            try {
                if (window.liffReadyPromise) {
                    await window.liffReadyPromise;
                }

                const { getAuth } = await import('https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js');
                const { getFirestore, collection, query, where, getDocs } = await import('https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js');
                const { getApp } = await import('https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js');

                const app = getApp();
                const auth = getAuth(app);
                const user = auth.currentUser;
                if (!user) {
                    container.innerHTML = `<div class="empty-state"><i class="bi bi-people"></i><p>Please log in to see schedule</p></div>`;
                    return;
                }
                currentUser = user;

                const db = getFirestore(app);

                const friendsQuery = query(
                    collection(db, 'friendships'),
                    where('userId', '==', user.uid)
                );
                const friendsSnapshot = await getDocs(friendsQuery);
                const friendMap = new Map();
                friendsSnapshot.forEach(fDoc => {
                    const data = fDoc.data();
                    friendMap.set(data.friendId, data.friendName || 'Friend');
                });
                friendMap.set(user.uid, 'My');

                // 自分の予定
                const myEventsQuery = query(
                    collection(db, 'events'),
                    where('userId', '==', user.uid)
                );
                const myEventsSnapshot = await getDocs(myEventsQuery);

                // 共有予定（sharedWith == user.uid）
                const sharedEventsQuery = query(
                    collection(db, 'events'),
                    where('sharedWith', '==', user.uid)
                );
                const sharedEventsSnapshot = await getDocs(sharedEventsQuery);

                const eventMap = new Map();
                myEventsSnapshot.forEach(eDoc => {
                    const data = eDoc.data();
                    const id = eDoc.id;
                    if (!eventMap.has(id)) {
                        eventMap.set(id, { id: id, ...data, type: data.type || 'own' });
                    }
                });
                sharedEventsSnapshot.forEach(eDoc => {
                    const data = eDoc.data();
                    const id = eDoc.id;
                    if (!eventMap.has(id)) {
                        eventMap.set(id, { id: id, ...data, type: 'shared' });
                    }
                });

                const events = [];
                for (const [id, eventData] of eventMap) {
                    let displayName = 'Friend';
                    let isMe = false;
                    let friendName = '';

                    if (eventData.type === 'own') {
                        isMe = true;
                        displayName = 'My';
                        friendName = 'My';
                    } else if (eventData.type === 'shared') {
                        if (eventData.sharedWith === user.uid) {
                            // 友達から共有されたイベント
                            isMe = false;
                            const fName = friendMap.get(eventData.userId) || eventData.person || 'Friend';
                            displayName = fName;
                            friendName = fName;
                        } else {
                            // 自分が共有したイベント（自分が依頼者）
                            isMe = true;
                            displayName = 'My';
                            friendName = 'My';
                        }
                    } else {
                        if (eventData.userId === user.uid) {
                            isMe = true;
                            displayName = 'My';
                            friendName = 'My';
                        } else {
                            isMe = false;
                            const fName = friendMap.get(eventData.userId) || eventData.person || 'Friend';
                            displayName = fName;
                            friendName = fName;
                        }
                    }

                    let displayTitle = eventData.title || 'Untitled';
                    displayTitle = displayTitle.replace(/^\[With\s+.+?\]\s*/, '').trim();

                    let statusText = 'Pending';
                    let statusClass = 'pending';
                    if (eventData.status === 'confirmed') {
                        statusText = 'Confirmed';
                        statusClass = 'confirmed';
                    } else if (eventData.type === 'own') {
                        statusText = 'My Schedule';
                        statusClass = 'own';
                    } else if (eventData.type === 'shared') {
                        statusText = 'Shared';
                        statusClass = 'shared';
                    }

                    events.push({
                        id: id,
                        title: displayTitle,
                        originalTitle: eventData.title || 'Untitled',
                        date: eventData.date || '9999-99-99',
                        time: eventData.time || '--:--',
                        status: eventData.status || 'pending',
                        statusText: statusText,
                        statusClass: statusClass,
                        type: eventData.type || 'own',
                        userId: eventData.userId,
                        sharedWith: eventData.sharedWith || null,
                        displayName: displayName,
                        isMe: isMe,
                        person: eventData.person || displayName,
                        friendName: friendName || displayName
                    });
                }

                events.sort((a, b) => a.date.localeCompare(b.date));

                allEvents = events;
                document.getElementById('eventCount').textContent = events.length;
                applySortAndRender();

            } catch (error) {
                console.error('Load schedule error:', error);
                container.innerHTML = `<div class="empty-state"><i class="bi bi-exclamation-triangle"></i><p>Failed to load schedule</p><p class="sub">${error.message}</p></div>`;
            }
        }

        // ============================================================
        // ソート機能
        // ============================================================
        function setSort(type) {
            if (currentSort === type) {
                sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
            } else {
                currentSort = type;
                sortDirection = 'asc';
            }
            document.querySelectorAll('.sort-bar button[data-sort]').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.sort === type);
            });
            applySortAndRender();
        }

        function applySortAndRender() {
            const sorted = [...allEvents];
            switch (currentSort) {
                case 'date':
                    sorted.sort((a, b) => {
                        return sortDirection === 'asc' ? a.date.localeCompare(b.date) : b.date.localeCompare(a.date);
                    });
                    break;
                case 'name':
                    sorted.sort((a, b) => {
                        return sortDirection === 'asc' ? a.displayName.localeCompare(b.displayName) : b.displayName.localeCompare(a.displayName);
                    });
                    break;
                default: break;
            }
            renderEventList(sorted);
        }

        // ============================================================
        // レンダリング
        // ============================================================
        function renderEventList(events) {
            const container = document.getElementById('scheduleList');

            if (!events || events.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="bi bi-calendar3"></i>
                        <p>No schedule yet</p>
                        <p class="sub">Add your schedule from the Calendar page</p>
                        <a href="calendar.html" class="btn-add">Go to Calendar</a>
                    </div>
                `;
                return;
            }

            const myPictureUrl = window.currentUser?.pictureUrl || null;

            container.innerHTML = events.map(ev => {
                const dateInfo = formatDateDisplay(ev.date, ev.time);
                const safeTitle = escapeHtml(ev.title);
                let displayName = '';
                let isMe = ev.isMe || false;
                if (isMe) {
                    displayName = 'My';
                } else {
                    displayName = ev.friendName || ev.displayName || 'Friend';
                }
                const safeName = escapeHtml(displayName);

                let avatarHtml = '';
                if (isMe && myPictureUrl) {
                    avatarHtml = `<img src="${myPictureUrl}" style="width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid #06C755;" />`;
                } else {
                    const initial = (displayName.charAt(0) || 'F').toUpperCase();
                    const avatarClass = isMe ? 'friend-avatar-small me' : 'friend-avatar-small';
                    avatarHtml = `<div class="${avatarClass}">${initial}</div>`;
                }

                const deleteBtn = `<button class="btn-delete-event" onclick="deleteEvent('${ev.id}')" title="Delete event"><i class="bi bi-trash3"></i></button>`;

                return `
                    <div class="friend-item">
                        <div class="event-date-area">
                            <div class="event-date-day">${dateInfo.day}</div>
                            <div class="event-date-month">${dateInfo.month}</div>
                            <div class="event-date-time">${dateInfo.time}</div>
                        </div>
                        <div class="event-info-area">
                            <div class="event-title">${safeTitle}</div>
                            <div class="event-person">
                                👤 <span class="person-name">${safeName}</span>
                                ${isMe ? ' (My)' : ''}
                            </div>
                            <span class="event-status-badge ${ev.statusClass}">${ev.statusText}</span>
                        </div>
                        <div class="event-actions-area">
                            ${avatarHtml}
                            ${deleteBtn}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ============================================================
        // イベント削除
        // ============================================================
        async function deleteEvent(eventId) {
            console.log('🗑️ deleteEvent 開始');
            console.log('🔍 eventId:', eventId);

            try {
                if (window.liffReadyPromise) {
                    await window.liffReadyPromise;
                }

                const { getAuth } = await import('https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js');
                const { getFirestore, doc, deleteDoc, getDoc, collection, addDoc } = await import('https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js');
                const { getApp } = await import('https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js');

                const app = getApp();
                const auth = getAuth(app);
                const user = auth.currentUser;
                if (!user) {
                    alert('Please log in to delete events.');
                    return;
                }

                const db = getFirestore(app);
                const eventRef = doc(db, 'events', eventId);
                const eventSnap = await getDoc(eventRef);

                if (!eventSnap.exists) {
                    alert('Event not found.');
                    return;
                }

                const eventData = eventSnap.data();

                if (eventData.type === 'shared') {
                    const canDeleteDirectly = eventData.role === 'acceptor' ||
                        (eventData.sharedWith && eventData.sharedWith === user.uid);

                    if (canDeleteDirectly) {
                        if (!confirm(`Delete shared event "${eventData.title}"?`)) return;
                        await deleteDoc(eventRef);
                        alert('✅ Shared event deleted.');
                    } else {
                        if (confirm(`"${eventData.title}" was shared by your friend. Send cancellation request?`)) {
                            await addDoc(collection(db, 'friendEvents'), {
                                fromUserId: user.uid,
                                toUserId: eventData.userId || eventData.sharedWith,
                                date: eventData.date,
                                time: eventData.time,
                                title: `[CANCEL] ${eventData.title}`,
                                note: `${window.currentUser?.displayName || 'Someone'} wants to cancel this shared event.`,
                                status: 'pending',
                                createdAt: new Date().toISOString(),
                                updatedAt: new Date().toISOString()
                            });
                            alert('✅ Cancellation request sent to your friend.');
                            await loadAllData();
                            await loadFriendRequests();
                            await openFriendRequestsModal();
                        }
                        return;
                    }
                } else {
                    if (!confirm(`Delete "${eventData.title}"?`)) return;
                    await deleteDoc(eventRef);
                    alert('✅ Event deleted.');
                }

                await loadAllData();

            } catch (error) {
                console.error('❌ Delete error:', error);
                alert('Failed to delete event. Please try again.\n\n' + error.message);
            }
        }

        // ============================================================
        // 友達からのイベント申請一覧を取得
        // ============================================================
        let pendingRequests = [];

        async function loadFriendRequests() {
            try {
                if (window.liffReadyPromise) {
                    await window.liffReadyPromise;
                }

                const { getAuth } = await import('https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js');
                const { getFirestore, collection, query, where, getDocs } = await import('https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js');
                const { getApp } = await import('https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js');

                const app = getApp();
                const auth = getAuth(app);
                const user = auth.currentUser;
                if (!user) return [];

                const db = getFirestore(app);
                const requests = [];

                const pendingQuery = query(
                    collection(db, 'friendEvents'),
                    where('toUserId', '==', user.uid),
                    where('status', '==', 'pending')
                );
                const pendingSnapshot = await getDocs(pendingQuery);
                pendingSnapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    const isCancel = data.title && data.title.startsWith('[CANCEL]');
                    requests.push({
                        id: docSnap.id,
                        fromUserId: data.fromUserId,
                        fromUserName: data.fromUserName || 'Friend',
                        date: data.date,
                        time: data.time,
                        title: data.title,
                        note: data.note || '',
                        status: data.status,
                        createdAt: data.createdAt,
                        isCancel: isCancel
                    });
                });

                requests.sort((a, b) => {
                    return new Date(b.createdAt) - new Date(a.createdAt);
                });

                pendingRequests = requests;
                return requests;
            } catch (error) {
                console.error('Load friend requests error:', error);
                return [];
            }
        }

        // ============================================================
        // 申請一覧モーダルを開く
        // ============================================================
        async function openFriendRequestsModal() {
            const modal = document.getElementById('friendRequestsModal');
            const container = document.getElementById('friendRequestList');

            // ★ モーダルがすでに開いている場合は閉じてから開き直す
            if (modal.classList.contains('active')) {
                modal.classList.remove('active');
                // 少し待ってから開き直す
                await new Promise(resolve => setTimeout(resolve, 100));
            }

            modal.classList.add('active');
            container.innerHTML = '<div style="text-align:center;color:#bbb;padding:20px 0;font-size:13px;">Loading requests...</div>';

            const requests = await loadFriendRequests();

            if (requests.length === 0) {
                container.innerHTML = `<div style="text-align:center;color:#bbb;padding:20px 0;font-size:13px;">📭 No pending requests</div>`;
                return;
            }

            const normalRequests = requests.filter(r => !r.isCancel);
            const cancelRequests = requests.filter(r => r.isCancel);

            let html = '';

            if (normalRequests.length > 0) {
                html += `<div style="font-weight:600;font-size:14px;color:#333;margin-bottom:8px;">📩 Event Requests</div>`;
                html += normalRequests.map(req => {
                    const displayTime = formatTimeDisplay(req.time);
                    return `
                        <div class="request-item">
                            <div style="display:flex;justify-content:space-between;align-items:start;flex-wrap:wrap;gap:8px;">
                                <div style="flex:1;">
                                    <div style="font-weight:600;font-size:15px;">${escapeHtml(req.title)}</div>
                                    <div style="font-size:13px;color:#666;">📅 ${escapeHtml(req.date)} ${displayTime}</div>
                                    <div style="font-size:12px;color:#888;">👤 From: ${escapeHtml(req.fromUserName)}</div>
                                    ${req.note ? `<div style="font-size:12px;color:#999;margin-top:4px;">📝 ${escapeHtml(req.note)}</div>` : ''}
                                </div>
                                <div style="display:flex;gap:8px;flex-shrink:0;">
                                    <button class="btn btn-success btn-sm" onclick="handleFriendRequest('${req.id}', 'confirmed')" style="padding:6px 16px;border:none;border-radius:999px;background:#06C755;color:white;font-weight:600;cursor:pointer;">Accept</button>
                                    <button class="btn btn-danger btn-sm" onclick="handleFriendRequest('${req.id}', 'rejected')" style="padding:6px 16px;border:none;border-radius:999px;background:#e53935;color:white;font-weight:600;cursor:pointer;">Decline</button>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            if (cancelRequests.length > 0) {
                html += `<div style="font-weight:600;font-size:14px;color:#e53935;margin-top:16px;margin-bottom:8px;">❌ Cancellation Requests</div>`;
                html += cancelRequests.map(req => {
                    const displayTime = formatTimeDisplay(req.time);
                    const displayTitle = req.title.replace('[CANCEL] ', '');
                    return `
                        <div class="request-item" style="background:#fff5f5;border:1px solid #ffcdd2;">
                            <div style="display:flex;justify-content:space-between;align-items:start;flex-wrap:wrap;gap:8px;">
                                <div style="flex:1;">
                                    <div style="font-weight:600;font-size:15px;color:#e53935;">❌ Cancel: ${escapeHtml(displayTitle)}</div>
                                    <div style="font-size:13px;color:#666;">📅 ${escapeHtml(req.date)} ${displayTime}</div>
                                    <div style="font-size:12px;color:#888;">👤 From: ${escapeHtml(req.fromUserName)}</div>
                                    ${req.note ? `<div style="font-size:12px;color:#999;margin-top:4px;">📝 ${escapeHtml(req.note)}</div>` : ''}
                                </div>
                                <div>
                                    <button class="btn btn-success btn-sm" onclick="handleCancellation('${req.id}', '${req.fromUserId}')" style="padding:6px 16px;border:none;border-radius:999px;background:#06C755;color:white;font-weight:600;cursor:pointer;">Accept Cancellation</button>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            container.innerHTML = html || `<div style="text-align:center;color:#bbb;padding:20px 0;font-size:13px;">📭 No requests</div>`;
        }

        function closeFriendRequestsModal() {
            const modal = document.getElementById('friendRequestsModal');
            if (modal) {
                modal.classList.remove('active');
            }
        }

        // ============================================================
        // 友達からのイベント申請を処理（承諾/拒否）
        // ============================================================
        async function handleFriendRequest(requestId, status) {
            if (status === 'rejected') {
                if (!confirm('Decline this event request?')) return;
            } else {
                if (!confirm('Accept this event request?')) return;
            }

            try {
                if (window.liffReadyPromise) {
                    await window.liffReadyPromise;
                }

                const { getAuth } = await import('https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js');
                const { getFirestore, doc, updateDoc, getDoc, collection, addDoc } = await import('https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js');
                const { getApp } = await import('https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js');

                const app = getApp();
                const auth = getAuth(app);
                const user = auth.currentUser;
                if (!user) {
                    alert('Please log in.');
                    return;
                }

                const db = getFirestore(app);

                const requestRef = doc(db, 'friendEvents', requestId);
                const requestSnap = await getDoc(requestRef);
                const requestData = requestSnap.data();

                await updateDoc(requestRef, {
                    status: status,
                    updatedAt: new Date().toISOString()
                });

                if (status === 'confirmed') {
                    const eventsRef = collection(db, 'events');
                    const myDisplayName = window.currentUser?.displayName || 'Me';

                    await addDoc(eventsRef, {
                        userId: user.uid,
                        date: requestData.date,
                        time: requestData.time,
                        title: `[With ${requestData.fromUserName}] ${requestData.title}`,
                        person: requestData.fromUserName,
                        type: 'shared',
                        status: 'confirmed',
                        sharedWith: requestData.fromUserId,
                        role: 'acceptor',
                        createdAt: new Date().toISOString(),
                        updatedAt: new Date().toISOString()
                    });

                    await addDoc(eventsRef, {
                        userId: requestData.fromUserId,
                        date: requestData.date,
                        time: requestData.time,
                        title: `[With ${myDisplayName}] ${requestData.title}`,
                        person: myDisplayName,
                        type: 'shared',
                        status: 'confirmed',
                        sharedWith: user.uid,
                        role: 'requester',
                        createdAt: new Date().toISOString(),
                        updatedAt: new Date().toISOString()
                    });

                    alert('✅ Event confirmed! Added to both calendars.');
                } else {
                    alert('❌ Event declined.');
                }

                await loadFriendRequests();
                await openFriendRequestsModal();

            } catch (error) {
                console.error('Handle friend request error:', error);
                alert('Failed to process request. Please try again.');
            }
        }

        // ============================================================
        // キャンセルリクエストを承認
        // ============================================================
        async function handleCancellation(requestId, friendId) {
            if (!confirm('Accept this cancellation request? Both calendars will be updated.')) return;

            try {
                if (window.liffReadyPromise) {
                    await window.liffReadyPromise;
                }

                const { getAuth } = await import('https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js');
                const { getFirestore, doc, updateDoc, getDoc, collection, query, where, getDocs, deleteDoc } = await import('https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js');
                const { getApp } = await import('https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js');

                const app = getApp();
                const auth = getAuth(app);
                const user = auth.currentUser;
                if (!user) {
                    alert('Please log in.');
                    return;
                }

                const db = getFirestore(app);

                const requestRef = doc(db, 'friendEvents', requestId);
                const requestSnap = await getDoc(requestRef);
                const requestData = requestSnap.data();

                await updateDoc(requestRef, {
                    status: 'approved',
                    updatedAt: new Date().toISOString()
                });

                const cleanTitle = requestData.title.replace('[CANCEL] ', '').trim();

                const myEventsQuery = query(
                    collection(db, 'events'),
                    where('userId', '==', user.uid),
                    where('date', '==', requestData.date)
                );
                const myEvents = await getDocs(myEventsQuery);
                for (const docSnap of myEvents.docs) {
                    const data = docSnap.data();
                    if (data.title && data.title.includes(cleanTitle)) {
                        await deleteDoc(docSnap.ref);
                    }
                }

                const friendEventsQuery = query(
                    collection(db, 'events'),
                    where('userId', '==', friendId),
                    where('date', '==', requestData.date)
                );
                const friendEvents = await getDocs(friendEventsQuery);
                for (const docSnap of friendEvents.docs) {
                    const data = docSnap.data();
                    if (data.title && data.title.includes(cleanTitle)) {
                        await deleteDoc(docSnap.ref);
                    }
                }

                alert('✅ Cancellation accepted. Events removed from both calendars.');

                await loadFriendRequests();
                await openFriendRequestsModal();

            } catch (error) {
                console.error('Handle cancellation error:', error);
                alert('Failed to process cancellation. Please try again.');
            }
        }

        // ============================================================
        // 初期化
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof renderPage === 'function') {
                renderPage('Schedule List', '', 'friends');
            }
            loadAllData();

            // ★ リクエストモーダルの閉じるボタン
            document.getElementById('friendRequestsCloseBtn').addEventListener('click', closeFriendRequestsModal);
            document.getElementById('friendRequestsModal').addEventListener('click', function(e) {
                if (e.target === this) closeFriendRequestsModal();
            });
        });
    </script>
</body>
