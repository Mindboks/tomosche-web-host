<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Schedule List - Tomosche</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://static.line-scdn.net/liff/edge/2.1/sdk.js"></script>
    <script src="js/auth-guard.js"></script>
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
    <script src="js/escape.js"></script>
    <script src="js/template.js"></script>
    <style>
        /* ✅ 全体の余白を広げる */
        .container.py-3 { padding: 16px 12px !important; max-width: 100% !important; }
        
        .friend-item {
            display: flex;
            align-items: stretch;
            padding: 12px 0;
            border-bottom: 1px solid #f0f4f8;
            gap: 12px;
            width: 100%;
        }
        .friend-item:last-child { border-bottom: none; }

        /* ✅ 日付エリア（左側・大きく） */
        .event-date-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-width: 60px;
            flex-shrink: 0;
            background: #f8f9fa;
            border-radius: 12px;
            padding: 8px 12px;
        }
        .event-date-day {
            font-size: 22px;
            font-weight: 700;
            color: #333;
            line-height: 1.2;
        }
        .event-date-month {
            font-size: 12px;
            color: #888;
            font-weight: 600;
            text-transform: uppercase;
        }
        .event-date-time {
            font-size: 13px;
            color: #06C755;
            font-weight: 600;
            margin-top: 2px;
        }

        /* ✅ イベント情報エリア（中央・広く） */
        .event-info-area {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 4px 0;
        }
        .event-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            line-height: 1.3;
        }
        .event-person {
            font-size: 13px;
            color: #888;
            margin-top: 2px;
        }
        .event-person .person-name {
            font-weight: 500;
            color: #555;
        }
        .event-status-badge {
            display: inline-block;
            font-size: 10px;
            padding: 1px 10px;
            border-radius: 999px;
            font-weight: 600;
            margin-top: 4px;
        }
        .event-status-badge.own { background: #e3f2fd; color: #1565c0; }
        .event-status-badge.shared { background: #fff3e0; color: #e65100; }
        .event-status-badge.confirmed { background: #e8f5e9; color: #2e7d32; }

        /* ✅ 友達アイコン + 削除ボタン（右側・縦並び） */
        .event-actions-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            flex-shrink: 0;
            min-width: 44px;
        }
        .friend-avatar-small {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 16px;
            color: #2e7d32;
            background: #e8f5e9;
            border: 2px solid white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .friend-avatar-small.me {
            background: #e3f2fd;
            color: #1565c0;
        }

        .btn-delete-event {
            background: none;
            border: none;
            color: #ccc;
            font-size: 16px;
            cursor: pointer;
            padding: 4px;
            transition: all 0.2s;
            border-radius: 50%;
        }
        .btn-delete-event:hover {
            color: #e53935;
            background: rgba(229, 57, 53, 0.08);
        }

        /* ✅ 空の状態 */
        .empty-state {
            text-align: center;
            padding: 48px 20px;
            color: #999;
        }
        .empty-state i { font-size: 56px; color: #ddd; display: block; margin-bottom: 16px; }
        .empty-state p { font-size: 14px; margin-bottom: 4px; }
        .empty-state .sub { font-size: 12px; color: #bbb; }
        .empty-state .btn-add {
            display: inline-block;
            margin-top: 16px;
            background: #06C755;
            color: white;
            padding: 10px 32px;
            border-radius: 999px;
            text-decoration: none;
            font-weight: 600;
        }

        /* ✅ ソートバー */
        .sort-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .sort-bar button {
            padding: 6px 14px;
            border-radius: 999px;
            border: 1px solid #ddd;
            background: white;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .sort-bar button.active {
            background: #06C755;
            color: white;
            border-color: #06C755;
        }
        .sort-bar button:hover:not(.active) {
            background: #f5f5f5;
        }

        .friend-count-badge {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 2px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
            margin-left: 8px;
        }

        /* ✅ レスポンシブ */
        @media (max-width: 480px) {
            .event-date-day { font-size: 18px; }
            .event-date-area { min-width: 50px; padding: 6px 8px; }
            .event-title { font-size: 14px; }
            .friend-avatar-small { width: 34px; height: 34px; font-size: 14px; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="container py-3" id="friendsContent">
            <div class="d-flex align-items-center mb-3">
                <button class="back-btn" onclick="history.back()"><i class="bi bi-arrow-left"></i></button>
                <h1 class="page-title" style="font-size:clamp(1.2rem, 4vw, 1.6rem);">Schedule List</h1>
                <span class="friend-count-badge" id="eventCount">0</span>
            </div>

            <!-- ソートバー -->
            <div class="sort-bar">
                <button class="active" data-sort="date" onclick="setSort('date')">📅 Date</button>
                <button data-sort="name" onclick="setSort('name')">👤 Name</button>
                <button id="refreshBtn" onclick="loadAllData()" style="margin-left:auto;border-color:#2196f3;color:#2196f3;">🔄 Refresh</button>
            </div>

            <div id="scheduleList"></div>
        </div>
    </div>

    <script>
        // ============================================================
        // 変数宣言
        // ============================================================
        let allEvents = [];
        let currentSort = 'date';
        let sortDirection = 'asc';
        let currentUser = null;

        // ============================================================
        // 日付フォーマット（月/日 時:分）
        // ============================================================
        function formatDateDisplay(dateStr, timeStr) {
            if (!dateStr) return { day: '--', month: '--', time: '--:--' };
            const parts = dateStr.split('-');
            if (parts.length < 3) return { day: '--', month: '--', time: '--:--' };
            const month = parseInt(parts[1], 10);
            const day = parseInt(parts[2], 10);
            
            // 時間フォーマット
            let timeDisplay = '--:--';
            if (timeStr) {
                const tParts = timeStr.split(':');
                if (tParts.length >= 2) {
                    let hour = parseInt(tParts[0], 10);
                    const minute = tParts[1] || '00';
                    if (!isNaN(hour)) {
                        const ampm = hour >= 12 ? 'PM' : 'AM';
                        hour = hour % 12;
                        if (hour === 0) hour = 12;
                        timeDisplay = `${hour}:${minute} ${ampm}`;
                    }
                }
            }
            
            const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            return {
                day: String(day),
                month: monthNames[month - 1] || '---',
                time: timeDisplay
            };
        }

        // ============================================================
        // 全イベントを読み込む（自分 + 友達）
        // ============================================================
        async function loadAllData() {
            const container = document.getElementById('scheduleList');
            container.innerHTML = '<div style="text-align:center;color:#bbb;padding:20px 0;">Loading...</div>';

            try {
                if (window.liffReadyPromise) {
                    await window.liffReadyPromise;
                }

                const { getAuth } = await import('https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js');
                const { getFirestore, collection, query, where, getDocs } = await import('https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js');
                const { getApp } = await import('https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js');

                const app = getApp();
                const auth = getAuth(app);
                const user = auth.currentUser;
                if (!user) {
                    container.innerHTML = `<div class="empty-state"><i class="bi bi-people"></i><p>Please log in to see schedule</p></div>`;
                    return;
                }
                currentUser = user;

                const db = getFirestore(app);

                // 1. 友達一覧を取得（表示名取得用）
                const friendsQuery = query(
                    collection(db, 'friendships'),
                    where('userId', '==', user.uid)
                );
                const friendsSnapshot = await getDocs(friendsQuery);
                const friendMap = new Map();
                friendsSnapshot.forEach(doc => {
                    const data = doc.data();
                    friendMap.set(data.friendId, data.friendName || 'Friend');
                });
                // ★ 自分自身もマップに追加（自分のイベント用）
                friendMap.set(user.uid, 'My');

                // 2. ★ 自分の予定を取得（userId == user.uid）
                const myEventsQuery = query(
                    collection(db, 'events'),
                    where('userId', '==', user.uid)
                );
                const myEventsSnapshot = await getDocs(myEventsQuery);
                
                // 3. ★ 共有予定を取得（sharedWith == user.uid）
                const sharedEventsQuery = query(
                    collection(db, 'events'),
                    where('sharedWith', '==', user.uid)
                );
                const sharedEventsSnapshot = await getDocs(sharedEventsQuery);

                // 4. イベントをマップに格納（重複防止）
                const eventMap = new Map();
                
                // 自分の予定
                myEventsSnapshot.forEach(doc => {
                    const data = doc.data();
                    const id = doc.id;
                    if (!eventMap.has(id)) {
                        eventMap.set(id, {
                            id: id,
                            ...data,
                            isOwn: true,
                            type: data.type || 'own'
                        });
                    }
                });
                
                // 共有予定
                sharedEventsSnapshot.forEach(doc => {
                    const data = doc.data();
                    const id = doc.id;
                    if (!eventMap.has(id)) {
                        eventMap.set(id, {
                            id: id,
                            ...data,
                            isOwn: false,
                            type: 'shared'
                        });
                    }
                });


                
                // 5. ★★★ イベントリストに変換（最終修正版）★★★
                const events = [];
                for (const [id, eventData] of eventMap) {
                    // 表示名を決定
                    let displayName = 'Friend';
                    let isMe = false;
                    let friendName = '';
                    
                    // ★★★ 修正: イベントの所有者を正しく判定 ★★★
                    // 1. ★★★ 自分のイベント（userId == user.uid かつ type == 'own'）★★★
                    if (eventData.userId === user.uid && eventData.type === 'own') {
                        isMe = true;
                        displayName = 'My';
                        friendName = 'My';
                    } 
                    // 2. ★★★ 自分が共有したイベント（userId == user.uid かつ type == 'shared'）★★★
                    // → この場合、自分は依頼者（requester）なので、共有相手が友達
                    else if (eventData.userId === user.uid && eventData.type === 'shared') {
                        isMe = true;
                        displayName = 'My';
                        friendName = 'My';
                    } 
                    // 3. ★★★ 友達のイベント（userId != user.uid）★★★
                    else if (eventData.userId !== user.uid) {
                        isMe = false;
                        // userId が友達なので、友達の名前を取得
                        const fName = friendMap.get(eventData.userId) || eventData.person || 'Friend';
                        displayName = fName;
                        friendName = fName;
                    } 
                    // 4. その他（person から取得）
                    else if (eventData.person) {
                        displayName = eventData.person;
                        friendName = eventData.person;
                    }

                    // タイトルを整形
                    let displayTitle = eventData.title || 'Untitled';
                    displayTitle = displayTitle.replace(/^\[With\s+.+?\]\s*/, '').trim();

                    // 状態
                    let statusText = 'Pending';
                    let statusClass = 'pending';
                    if (eventData.status === 'confirmed') {
                        statusText = 'Confirmed';
                        statusClass = 'confirmed';
                    } else if (eventData.type === 'own') {
                        statusText = 'My Schedule';
                        statusClass = 'own';
                    } else if (eventData.type === 'shared') {
                        statusText = 'Shared';
                        statusClass = 'shared';
                    }

                    events.push({
                        id: id,
                        title: displayTitle,
                        originalTitle: eventData.title || 'Untitled',
                        date: eventData.date || '9999-99-99',
                        time: eventData.time || '--:--',
                        status: eventData.status || 'pending',
                        statusText: statusText,
                        statusClass: statusClass,
                        type: eventData.type || 'own',
                        userId: eventData.userId,
                        sharedWith: eventData.sharedWith || null,
                        displayName: displayName,
                        isMe: isMe,
                        person: eventData.person || displayName,
                        isOwn: eventData.isOwn || false,
                        friendName: friendName || displayName
                    });
                }




                // ソート
                events.sort((a, b) => a.date.localeCompare(b.date));

                allEvents = events;
                document.getElementById('eventCount').textContent = events.length;
                applySortAndRender();

            } catch (error) {
                console.error('Load schedule error:', error);
                container.innerHTML = `<div class="empty-state"><i class="bi bi-exclamation-triangle"></i><p>Failed to load schedule</p><p class="sub">${error.message}</p></div>`;
            }
        }

        // ============================================================
        // ソート機能
        // ============================================================
        function setSort(type) {
            if (currentSort === type) {
                sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
            } else {
                currentSort = type;
                sortDirection = 'asc';
            }

            document.querySelectorAll('.sort-bar button[data-sort]').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.sort === type);
            });

            applySortAndRender();
        }

        function applySortAndRender() {
            const sorted = [...allEvents];

            switch (currentSort) {
                case 'date':
                    sorted.sort((a, b) => {
                        return sortDirection === 'asc' ? a.date.localeCompare(b.date) : b.date.localeCompare(a.date);
                    });
                    break;
                case 'name':
                    sorted.sort((a, b) => {
                        return sortDirection === 'asc' ? a.displayName.localeCompare(b.displayName) : b.displayName.localeCompare(a.displayName);
                    });
                    break;
                default:
                    break;
            }

            renderEventList(sorted);
        }

        // ============================================================
        // レンダリング
        // ============================================================
        function renderEventList(events) {
            const container = document.getElementById('scheduleList');

            if (!events || events.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="bi bi-calendar3"></i>
                        <p>No schedule yet</p>
                        <p class="sub">Add your schedule from the Calendar page</p>
                        <a href="calendar.html" class="btn-add">Go to Calendar</a>
                    </div>
                `;
                return;
            }

            // 自分のプロフィール画像を取得
            const myPictureUrl = window.currentUser?.pictureUrl || null;

            container.innerHTML = events.map(ev => {
                const dateInfo = formatDateDisplay(ev.date, ev.time);
                const safeTitle = escapeHtml(ev.title);
                
                // ★★★ 修正: 表示名を正しく設定 ★★★
                // isMe が true の場合は 'My'、それ以外は friendName または displayName を使用
                let displayName = '';
                let isMe = ev.isMe || false;
                
                if (isMe) {
                    displayName = 'My';
                } else {
                    // 友達の名前を優先
                    displayName = ev.friendName || ev.displayName || 'Friend';
                }
                
                const safeName = escapeHtml(displayName);
                
                // ★ アイコン表示（自分の場合はLINE画像、友達は頭文字）
                let avatarHtml = '';
                if (isMe && myPictureUrl) {
                    avatarHtml = `<img src="${myPictureUrl}" style="width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid #06C755;" />`;
                } else {
                    const initial = (displayName.charAt(0) || 'F').toUpperCase();
                    const avatarClass = isMe ? 'friend-avatar-small me' : 'friend-avatar-small';
                    avatarHtml = `<div class="${avatarClass}">${initial}</div>`;
                }

                const deleteBtn = `<button class="btn-delete-event" onclick="deleteEvent('${ev.id}')" title="Delete event"><i class="bi bi-trash3"></i></button>`;

                return `
                    <div class="friend-item">
                        <div class="event-date-area">
                            <div class="event-date-day">${dateInfo.day}</div>
                            <div class="event-date-month">${dateInfo.month}</div>
                            <div class="event-date-time">${dateInfo.time}</div>
                        </div>
                        <div class="event-info-area">
                            <div class="event-title">${safeTitle}</div>
                            <div class="event-person">
                                👤 <span class="person-name">${safeName}</span>
                                ${isMe ? ' (My)' : ''}
                            </div>
                            <span class="event-status-badge ${ev.statusClass}">${ev.statusText}</span>
                        </div>
                        <div class="event-actions-area">
                            ${avatarHtml}
                            ${deleteBtn}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ============================================================
        // イベント削除（カレンダーと同じロジック）
        // ============================================================
        async function deleteEvent(eventId) {
            console.log('🗑️ deleteEvent 開始');
            console.log('🔍 eventId:', eventId);
            
            try {
                if (window.liffReadyPromise) {
                    await window.liffReadyPromise;
                }

                const { getAuth } = await import('https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js');
                const { getFirestore, doc, deleteDoc, getDoc, collection, addDoc } = await import('https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js');
                const { getApp } = await import('https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js');
                
                const app = getApp();
                const auth = getAuth(app);
                const user = auth.currentUser;
                if (!user) {
                    alert('Please log in to delete events.');
                    return;
                }

                console.log('👤 現在のユーザーUID:', user.uid);

                const db = getFirestore(app);
                const eventRef = doc(db, 'events', eventId);
                const eventSnap = await getDoc(eventRef);
                
                if (!eventSnap.exists) {
                    alert('Event not found.');
                    return;
                }
                
                const eventData = eventSnap.data();
                console.log('📄 イベントデータ:', JSON.stringify(eventData, null, 2));

                // ★ カレンダーと同じ削除ロジック
                if (eventData.type === 'shared') {
                    // 承諾者（role === 'acceptor'）または sharedWith が自分と一致する場合 → 直接削除可能
                    const canDeleteDirectly = eventData.role === 'acceptor' || 
                                              (eventData.sharedWith && eventData.sharedWith === user.uid);
                    
                    console.log('🔍 isShared: true');
                    console.log('🔍 canDeleteDirectly:', canDeleteDirectly);
                    
                    if (canDeleteDirectly) {
                        if (!confirm(`Delete shared event "${eventData.title}"?`)) return;
                        await deleteDoc(eventRef);
                        alert('✅ Shared event deleted.');
                        console.log('✅ 共有イベントを直接削除');
                    } else {
                        // キャンセルリクエストを送信
                        if (confirm(`"${eventData.title}" was shared by your friend. Send cancellation request?`)) {
                            console.log('📤 キャンセルリクエスト送信中...');
                            await addDoc(collection(db, 'friendEvents'), {
                                fromUserId: user.uid,
                                toUserId: eventData.userId || eventData.sharedWith,
                                date: eventData.date,
                                time: eventData.time,
                                title: `[CANCEL] ${eventData.title}`,
                                note: `${window.currentUser?.displayName || 'Someone'} wants to cancel this shared event.`,
                                status: 'pending',
                                createdAt: new Date().toISOString(),
                                updatedAt: new Date().toISOString()
                            });
                            alert('✅ Cancellation request sent to your friend.');
                            console.log('✅ キャンセルリクエスト送信完了');
                        }
                        return;
                    }
                } else {
                    // 自分のイベントは直接削除
                    if (!confirm(`Delete "${eventData.title}"?`)) return;
                    await deleteDoc(eventRef);
                    alert('✅ Event deleted.');
                    console.log('✅ 自分のイベントを削除');
                }
                
                // 再読み込み
                await loadAllData();

            } catch (error) {
                console.error('❌ Delete error:', error);
                alert('Failed to delete event. Please try again.\n\n' + error.message);
            }
        }

        // ============================================================
        // 初期化
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof renderPage === 'function') {
                renderPage('Schedule List', '', 'friends');
            }
            loadAllData();
        });
    </script>
</body>
</html>
