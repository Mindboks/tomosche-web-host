<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Friends - Tomosche</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://static.line-scdn.net/liff/edge/2.1/sdk.js"></script>
    <style>
        /* friends.html 固有スタイルは style.css に統合済みのため、追加なし */
    </style>
</head>
<body>
    <div id="app">
        <div class="container py-3">
            <div class="d-flex align-items-center mb-3">
                <button class="back-btn" onclick="history.back()"><i class="bi bi-arrow-left"></i></button>
                <h1 class="page-title">Friends</h1>
            </div>
            <div id="friendList"></div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
    <script src="js/template.js"></script>
    <script>
        const sampleFriends = [
            { id:1, name:'Tanaka Ichiro', initial:'田', status:'shared' },
            { id:2, name:'Sato Hanako', initial:'佐', status:'pending' },
            { id:3, name:'Suzuki Makoto', initial:'鈴', status:'shared' }
        ];
        let friends = sampleFriends;

        function renderFriendList() {
            const c = document.getElementById('friendList');
            if (!friends||!friends.length) {
                c.innerHTML = `<div class="empty-state"><i class="bi bi-people"></i><p>No friends yet</p><p class="sub">Invite friends from the Add page</p><a href="add.html" class="btn-add">Add Friends</a></div>`;
                return;
            }
            c.innerHTML = friends.map(fr => `
                <div class="friend-item">
                    <div class="friend-avatar">${fr.initial}</div>
                    <div class="friend-info">
                        <div class="friend-name">${fr.name}</div>
                        <div class="friend-status ${fr.status}">${fr.status==='shared'?'✓ Calendar shared':'⏳ Pending approval'}</div>
                    </div>
                    <button class="friend-delete" onclick="deleteFriend(${fr.id})"><i class="bi bi-trash3"></i></button>
                </div>
            `).join('');
        }

        function deleteFriend(id) {
            const fr = friends.find(f=>f.id===id);
            if (!fr) return;
            if (confirm(`Delete "${fr.name}"?`)) {
                friends = friends.filter(f=>f.id!==id);
                renderFriendList();
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            renderPage('Friends', '', 'friends');
            renderFriendList();
        });
    </script>
</body>
</html>
