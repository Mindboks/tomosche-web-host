<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Calendar - Tomosche</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://static.line-scdn.net/liff/edge/2.1/sdk.js"></script>
    <script src="js/auth-guard.js"></script>
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
    <script src="js/escape.js"></script>
    <script src="js/template.js"></script>
    <style>
        .add-btn-group { display: flex; gap: 12px; margin-top: 16px; flex-wrap: wrap; }
        .add-btn-group button { flex: 1; padding: 12px; border-radius: 999px; font-size: 14px; font-weight: 600; border: none; cursor: pointer; min-width: 80px; }
        .add-btn-group button:active { transform: scale(0.95); }
        .btn-own { background: #2196f3; color: white; }
        .btn-own:hover { background: #1976d2; }
        .btn-shared { background: #06C755; color: white; }
        .btn-shared:hover { background: #049a44; }
        .btn-requests { background: #ff9800; color: white; }
        .btn-requests:hover { background: #e68900; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; background: #f0f4f8; border-radius: 16px; overflow: hidden; margin-top: 12px; max-width: 100% !important; }
        .calendar-day { background: white; aspect-ratio: 1 / 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: clamp(12px, 2.2vw, 14px); font-weight: 500; color: #333; cursor: pointer; position: relative; min-height: 32px; min-width: 32px; transition: all 0.15s ease; }
        .calendar-day.other-month { color: #ccc; }
        .calendar-day.today { background: #e8f5e9; font-weight: 700; color: #06C755; }
        .calendar-day.selected { background: #06C755; color: white; border-radius: 8px; }
        .calendar-day .dot { position: absolute; bottom: 5px; width: 6px; height: 6px; border-radius: 50%; }
        .calendar-day .dot.own { background: #2196f3; }
        .calendar-day .dot.pending { background: #ff9800; }
        .calendar-day .dot.confirmed { background: #06C755; }
        .calendar-weekday { background: #e8f5e9; color: #2e7d32; font-weight: 600; font-size: clamp(10px, 1.8vw, 13px); text-align: center; padding: 10px 0; }
        @media (max-width: 380px) {
            .calendar-day { font-size: 11px; min-height: 28px; min-width: 28px; }
            .calendar-grid { gap: 1px; border-radius: 12px; }
        }
        @media (min-width: 381px) and (max-width: 576px) {
            .calendar-day { font-size: clamp(12px, 2.5vw, 14px); min-height: 36px; min-width: 36px; }
        }
        @media (min-width: 577px) {
            .calendar-day { font-size: 14px; min-height: 40px; min-width: 40px; border-radius: 6px; }
            .calendar-day:hover { background: #f5f5f5; }
            .calendar-grid { gap: 3px; border-radius: 18px; }
        }
        @media (min-width: 1024px) {
            .calendar-day { font-size: 15px; min-height: 44px; min-width: 44px; border-radius: 8px; }
            .calendar-day:hover { background: #e8f5e9; }
            .calendar-grid { gap: 4px; border-radius: 20px; }
        }
        .event-list { margin-top: 16px; background: white; border-radius: 16px; padding: 16px; border: 1px solid #f0f4f8; }
        .event-item { display: flex; align-items: center; padding: 10px 0; border-bottom: 1px solid #f5f5f5; gap: 8px; flex-wrap: wrap; }
        .event-item:last-child { border-bottom: none; }
        .event-time { font-size: 12px; font-weight: 600; }
        .event-time.own { color: #2196f3; }
        .event-time.pending { color: #ff9800; }
        .event-time.confirmed { color: #06C755; }
        .event-title { font-size: 14px; color: #333; flex: 1; }
        .event-person { font-size: 12px; color: #888; background: #f0f4f8; padding: 2px 10px; border-radius: 999px; }
        .event-status { font-size: 10px; padding: 2px 8px; border-radius: 999px; }
        .event-status.own { background: #e3f2fd; color: #1565c0; }
        .event-status.pending { background: #fff3e0; color: #e65100; }
        .event-status.confirmed { background: #e8f5e9; color: #2e7d32; }
        .empty-events { text-align: center; color: #bbb; padding: 16px 0; }
        .cal-nav { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; }
        .cal-nav button { background: none; border: none; font-size: 22px; color: #06C755; padding: 8px 12px; cursor: pointer; }
        .cal-nav span { font-size: clamp(1.1rem, 3vw, 1.4rem); font-weight: 600; color: #333; }

        /* モーダルスタイル */
        .schedule-modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .schedule-modal-overlay.active {
            display: flex;
        }
        .schedule-modal {
            background: white;
            border-radius: 24px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .schedule-modal h3 {
            font-weight: 700;
            margin-bottom: 4px;
        }
        .schedule-modal .subtitle {
            color: #888;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .schedule-modal .form-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            align-items: center;
            background: #f8f9fa;
            padding: 8px 12px;
            border-radius: 12px;
            border: 1px solid #e9ecef;
            flex-wrap: wrap;
        }
        .schedule-modal .form-row .time-group {
            display: flex;
            align-items: center;
            gap: 4px;
            background: white;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 4px 8px;
            min-width: 160px;
            flex-shrink: 0;
        }
        .schedule-modal .form-row .time-group select {
            border: none;
            background: transparent;
            font-size: 14px;
            font-weight: 600;
            color: #2196f3;
            cursor: pointer;
            padding: 4px 2px;
            outline: none;
            font-family: inherit;
            appearance: auto;
            min-width: 44px;
        }
        .schedule-modal .form-row .time-group select:focus {
            outline: none;
        }
        .schedule-modal .form-row .time-group .time-separator {
            font-weight: 600;
            color: #999;
            font-size: 16px;
        }
        .schedule-modal .form-row .title-input {
            flex: 1;
            min-width: 80px;
            font-size: 14px;
            padding: 8px 12px;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            background: white;
            outline: none;
            transition: border-color 0.2s;
        }
        .schedule-modal .form-row .title-input:focus {
            border-color: #2196f3;
        }
        .schedule-modal .form-row .delete-row {
            background: none;
            border: none;
            color: #ccc;
            font-size: 18px;
            cursor: pointer;
            padding: 0 6px;
            flex-shrink: 0;
        }
        .schedule-modal .form-row .delete-row:hover {
            color: #e53935;
        }
        .schedule-modal .add-row-btn {
            background: none;
            border: 2px dashed #ddd;
            border-radius: 12px;
            padding: 12px;
            width: 100%;
            color: #999;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .schedule-modal .add-row-btn:hover {
            border-color: #2196f3;
            color: #2196f3;
        }
        .schedule-modal .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }
        .schedule-modal .modal-actions button {
            flex: 1;
            padding: 12px;
            border-radius: 999px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            font-size: 15px;
        }
        .schedule-modal .btn-cancel {
            background: #f0f4f8;
            color: #666;
        }
        .schedule-modal .btn-save {
            background: #2196f3;
            color: white;
        }
        .schedule-modal .btn-save:hover {
            background: #1976d2;
        }
        .schedule-modal .btn-save:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .schedule-modal .status-msg {
            margin-top: 12px;
            font-size: 13px;
            text-align: center;
            display: none;
        }
        .schedule-modal .status-msg.success {
            color: #06C755;
        }
        .schedule-modal .status-msg.error {
            color: #e53935;
        }

        /* イベント削除ボタン */
        .event-delete-btn {
            background: none;
            border: none;
            color: #ccc;
            font-size: 16px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 50%;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .event-delete-btn:hover {
            color: #e53935;
            background: rgba(229, 57, 53, 0.08);
        }

        .request-badge {
            background: red;
            color: white;
            border-radius: 50%;
            padding: 0px 6px;
            font-size: 11px;
            margin-left: 4px;
            display: none;
        }

        .request-item {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 10px;
            border: 1px solid #e9ecef;
        }
        .request-item:last-child { margin-bottom: 0; }

        @media (max-width: 480px) {
            .schedule-modal .form-row {
                flex-wrap: wrap;
                gap: 6px;
            }
            .schedule-modal .form-row .time-group {
                min-width: 140px;
            }
            .schedule-modal .form-row .time-group select {
                font-size: 13px;
                min-width: 38px;
            }
            .add-btn-group button {
                font-size: 12px;
                padding: 10px 8px;
                min-width: 60px;
            }
            }
            .calendar-day .dot.shared {
                background: #ff9800 !important;
            }

            .event-title {
                white-space: normal !important;
                word-break: break-word !important;
            }
            /* ✅ カレンダードット - 重複表示用 */
            .calendar-day .dot-wrapper {
                position: absolute;
                bottom: 3px;
                left: 50%;
                transform: translateX(-50%);
                display: flex;
                gap: 2px;
            }

            .calendar-day .dot-wrapper .dot {
                position: relative;
                bottom: 0;
                margin: 0;
            }

            /* 既存のドットスタイルを上書きしないように調整 */
            .calendar-day .dot {
                position: absolute;
                bottom: 5px;
                width: 6px;
                height: 6px;
                border-radius: 50%;
            }
    </style>
</head>
<body>
    <div class="app-container">
        <div id="calendarContent">
            <div class="container py-3">
                <div class="d-flex align-items-center mb-2">
                    <button class="back-btn" onclick="history.back()"><i class="bi bi-arrow-left"></i></button>
                    <h1 class="page-title">Calendar</h1>
                </div>

                <div class="cal-nav">
                    <button onclick="changeMonth(-1)"><i class="bi bi-chevron-left"></i></button>
                    <span id="calTitle">August 2026</span>
                    <button onclick="changeMonth(1)"><i class="bi bi-chevron-right"></i></button>
                </div>

                <div class="calendar-grid" id="calGrid"></div>

                <div class="event-list">
                    <div style="font-size:14px;font-weight:600;color:#666;margin-bottom:8px;">📋 Events for this day</div>
                    <div id="eventList"><div class="empty-events">Select a date</div></div>
                </div>

                <!-- ボタングループ（1つだけ） -->
                <div class="add-btn-group">
                    <button class="btn-own" id="addOwnEventBtn"><i class="bi bi-person"></i> My Schedule</button>
                    <button class="btn-shared" id="addSharedEventBtn"><i class="bi bi-people"></i> With Friend</button>
                    <button class="btn-requests" id="viewRequestsBtn">
                        <i class="bi bi-inbox"></i> Requests
                        <span class="request-badge" id="requestBadge">0</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- MySchedule モーダル -->
    <div class="schedule-modal-overlay" id="scheduleModal">
        <div class="schedule-modal">
            <h3>📝 My Schedule</h3>
            <div class="subtitle">Add your schedule for <span id="modalDateDisplay">2026-08-12</span></div>
            <div id="scheduleRows"></div>
            <button class="add-row-btn" id="addRowBtn"><i class="bi bi-plus-circle"></i> Add another schedule (max 10)</button>
            <div class="status-msg" id="modalStatus"></div>
            <div class="modal-actions">
                <button class="btn-cancel" id="modalCancelBtn">Cancel</button>
                <button class="btn-save" id="modalSaveBtn">Save All</button>
            </div>
        </div>
    </div>

    <!-- With Friend モーダル -->
    <div class="schedule-modal-overlay" id="friendEventModal">
        <div class="schedule-modal">
            <h3>📅 Schedule with Friend</h3>
            <div class="subtitle">Send an event request to your friend</div>
            <div style="margin-bottom:12px;">
                <label style="font-size:13px;font-weight:600;color:#666;display:block;margin-bottom:4px;">Select Friend</label>
                <select id="friendSelect" style="width:100%;padding:10px 14px;border:1px solid #ddd;border-radius:12px;font-size:14px;outline:none;background:white;">
                    <option value="">Loading friends...</option>
                </select>
            </div>
            <div style="display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;">
                <div style="flex:0 0 160px;min-width:140px;">
                    <label style="font-size:13px;font-weight:600;color:#666;display:block;margin-bottom:4px;">Date</label>
                    <input type="date" id="friendEventDate" style="width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:12px;font-size:14px;outline:none;" />
                </div>
                <div style="flex:1;min-width:180px;">
                    <label style="font-size:13px;font-weight:600;color:#666;display:block;margin-bottom:4px;">Time</label>
                    <div style="display:flex;gap:4px;align-items:center;">
                        <select id="friendEventHour" style="flex:1;padding:10px 4px;border:1px solid #ddd;border-radius:12px;font-size:14px;outline:none;background:white;text-align:center;">
                            <option value="01">01</option><option value="02">02</option><option value="03">03</option>
                            <option value="04">04</option><option value="05">05</option><option value="06">06</option>
                            <option value="07">07</option><option value="08">08</option><option value="09" selected>09</option>
                            <option value="10">10</option><option value="11">11</option><option value="12">12</option>
                        </select>
                        <span style="font-weight:600;color:#999;font-size:16px;">:</span>
                        <select id="friendEventMinute" style="flex:1;padding:10px 4px;border:1px solid #ddd;border-radius:12px;font-size:14px;outline:none;background:white;text-align:center;">
                            <option value="00">00</option><option value="05">05</option><option value="10">10</option>
                            <option value="15">15</option><option value="20">20</option><option value="25">25</option>
                            <option value="30" selected>30</option><option value="35">35</option><option value="40">40</option>
                            <option value="45">45</option><option value="50">50</option><option value="55">55</option>
                        </select>
                        <select id="friendEventAmpm" style="flex:0 0 60px;padding:10px 4px;border:1px solid #ddd;border-radius:12px;font-size:14px;outline:none;background:white;text-align:center;">
                            <option value="AM">AM</option>
                            <option value="PM" selected>PM</option>
                        </select>
                    </div>
                </div>
            </div>
            <div style="margin-bottom:12px;">
                <label style="font-size:13px;font-weight:600;color:#666;display:block;margin-bottom:4px;">Event Title</label>
                <input type="text" id="friendEventTitle" placeholder="What are you planning?" maxlength="100" style="width:100%;padding:10px 14px;border:1px solid #ddd;border-radius:12px;font-size:14px;outline:none;" />
            </div>
            <div style="margin-bottom:16px;">
                <label style="font-size:13px;font-weight:600;color:#666;display:block;margin-bottom:4px;">Note (optional)</label>
                <input type="text" id="friendEventNote" placeholder="Any details for your friend..." maxlength="200" style="width:100%;padding:10px 14px;border:1px solid #ddd;border-radius:12px;font-size:14px;outline:none;" />
            </div>
            <div class="status-msg" id="friendEventStatus"></div>
            <div class="modal-actions">
                <button class="btn-cancel" id="friendEventCancelBtn">Cancel</button>
                <button class="btn-save" id="friendEventSendBtn" style="background:#06C755;">Send Request</button>
            </div>
        </div>
    </div>

    <!-- 友達からのイベント申請一覧モーダル -->
    <div class="schedule-modal-overlay" id="friendRequestsModal">
        <div class="schedule-modal">
            <h3>📩 Friend Event Requests</h3>
            <div class="subtitle">Event requests from your friends</div>
            <div id="friendRequestList" style="margin-top:12px;">
                <div style="text-align:center;color:#bbb;padding:20px 0;font-size:13px;">Loading requests...</div>
            </div>
            <div class="modal-actions" style="margin-top:16px;">
                <button class="btn-cancel" id="friendRequestsCloseBtn" style="width:100%;">Close</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // 変数宣言
        // ============================================================
        let calYear = new Date().getFullYear();
        let calMonth = new Date().getMonth();
        let selectedDate = null;
        let currentEvents = {};
        const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
        const weekdays = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];



        // ============================================================
        // 時間フォーマット関数（修正版）
        // ============================================================
        function formatTimeDisplay(timeStr) {
            if (!timeStr) return '--:--';
            const parts = timeStr.split(':');
            if (parts.length < 2) return '--:--';
            let hour = parseInt(parts[0], 10);
            const minute = parts[1] || '00';
            if (isNaN(hour)) return '--:--';
            const ampm = hour >= 12 ? 'PM' : 'AM';
            hour = hour % 12;
            if (hour === 0) hour = 12;
            return `${hour}:${minute} ${ampm}`;
        }

        // ============================================================
        // 日付選択
        // ============================================================
        async function selectDate(ds) {
            console.log(`📅 日付選択: ${ds}`);
            selectedDate = ds;
            await renderCalendar();
            await renderEvents(ds);
        }

        // ============================================================
        // Firestore から予定を読み込む（修正版）
        // ============================================================
        async function loadEventsFromFirestore(dateStr) {
            try {
                if (window.liffReadyPromise) {
                    await window.liffReadyPromise;
                }

                const { getAuth } = await import('https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js');
                const { getFirestore, collection, query, where, getDocs } = await import('https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js');
                const { getApp } = await import('https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js');
                
                const app = getApp();
                const auth = getAuth(app);
                const user = auth.currentUser;
                if (!user) return [];

                const db = getFirestore(app);
                const events = [];
                const eventIds = new Set();

                // 1. 自分の予定（userId == user.uid）
                try {
                    const myQuery = query(
                        collection(db, 'events'),
                        where('userId', '==', user.uid),
                        where('date', '==', dateStr)
                    );
                    const mySnapshot = await getDocs(myQuery);
                    mySnapshot.forEach(doc => {
                        const data = doc.data();
                        const id = doc.id;
                        if (!eventIds.has(id)) {
                            eventIds.add(id);
                            events.push({
                                id: id,
                                time: data.time || '12:00',
                                title: data.title || 'Untitled',
                                person: data.person || 'Me',
                                note: data.note || '',
                                status: data.status || 'own',
                                type: data.type || 'own',
                                sharedWith: data.sharedWith || null,
                                role: data.role || null,
                                userId: data.userId || user.uid
                            });
                        }
                    });
                } catch (err) {
                    console.warn('自分の予定取得エラー:', err);
                }

                // 2. ✅ 友達から共有された予定（sharedWith == user.uid）
                //    これがないと友達のカレンダーに共有イベントが表示されない
                try {
                    const sharedQuery = query(
                        collection(db, 'events'),
                        where('sharedWith', '==', user.uid),
                        where('date', '==', dateStr)
                    );
                    const sharedSnapshot = await getDocs(sharedQuery);
                    sharedSnapshot.forEach(doc => {
                        const data = doc.data();
                        const id = doc.id;
                        if (!eventIds.has(id)) {
                            eventIds.add(id);
                            events.push({
                                id: id,
                                time: data.time || '12:00',
                                title: data.title || 'Untitled',
                                person: data.person || 'Friend',
                                note: data.note || '',
                                status: data.status || 'confirmed',
                                type: 'shared',
                                sharedWith: data.sharedWith || null,
                                role: data.role || null,
                                userId: data.userId || null
                            });
                        }
                    });
                } catch (err) {
                    console.warn('共有予定取得エラー:', err);
                }

                return events;
            } catch (error) {
                console.error('Load events error:', error);
                return [];
            }
        }

        // ============================================================
        // イベント削除（権限チェック強化版）
        // ============================================================
        async function deleteEvent(eventId, dateStr) {
            try {
                if (window.liffReadyPromise) {
                    await window.liffReadyPromise;
                }

                const { getAuth } = await import('https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js');
                const { getFirestore, doc, deleteDoc, getDoc, collection, addDoc } = await import('https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js');
                const { getApp } = await import('https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js');
                
                const app = getApp();
                const auth = getAuth(app);
                const user = auth.currentUser;
                if (!user) {
                    alert('Please log in to delete events.');
                    return;
                }

                const db = getFirestore(app);
                const eventRef = doc(db, 'events', eventId);
                const eventSnap = await getDoc(eventRef);
                
                if (!eventSnap.exists) {
                    alert('Event not found.');
                    return;
                }
                
                const eventData = eventSnap.data();

                // ✅ Sharedイベントの削除権限チェック（role フィールドで判定）
                if (eventData.type === 'shared') {
                    // 承諾者（role === 'acceptor'）のみ直接削除可能
                    if (eventData.role === 'acceptor') {
                        if (!confirm(`Delete shared event "${eventData.title}"?`)) return;
                        await deleteDoc(eventRef);
                        alert('✅ Shared event deleted.');
                    } else {
                        // ★ 依頼者（role === 'requester'）は削除リクエストを送信
                        // status を 'pending' にして Requests に表示させる
                        if (confirm(`"${eventData.title}" was shared by your friend. Send cancellation request?`)) {
                            await addDoc(collection(db, 'friendEvents'), {
                                fromUserId: user.uid,
                                toUserId: eventData.userId,
                                date: eventData.date,
                                time: eventData.time,
                                title: `[CANCEL] ${eventData.title}`,
                                note: `${window.currentUser?.displayName || 'Someone'} wants to cancel this shared event.`,
                                status: 'pending',  // ★ 'cancelled' → 'pending' に変更
                                createdAt: new Date().toISOString(),
                                updatedAt: new Date().toISOString()
                            });
                            alert('✅ Cancellation request sent to your friend.');
                        }
                        return;
                    }
                } else {
                    // 自分のイベントは直接削除
                    if (!confirm(`Delete "${eventData.title}"?`)) return;
                    await deleteDoc(eventRef);
                }
                
                // 再読み込み
                currentEvents[dateStr] = await loadEventsFromFirestore(dateStr);
                await renderCalendar();
                await renderEvents(dateStr);

            } catch (error) {
                console.error('Delete error:', error);
                alert('Failed to delete event. Please try again.');
            }
        }

                        displayPerson = currentUser.displayName;
                    }
                }
                
                let displayTitle = safe.title;
                if (isShared) {

                        displayTitle = `${match[2] || match[1]} (${match[1]})`;
                        displayPerson = match[1];
                        displayIcon = match[1].charAt(0).toUpperCase();
                    }
                }
                
                const displayTime = formatTimeDisplay(safe.time);
                
                // ✅ 削除ボタンは常に表示する。

        // ============================================================
        // カレンダー描画（強制ロード版）
        // ============================================================
        async function renderCalendar() {
            const grid = document.getElementById('calGrid');
            document.getElementById('calTitle').textContent = `${monthNames[calMonth]} ${calYear}`;

            const first = new Date(calYear, calMonth, 1).getDay();
            const last = new Date(calYear, calMonth + 1, 0).getDate();
            const today = new Date();

            // ✅ 強制的に月データを読み込む（キャッシュがあっても再取得しない）
            const monthKey = `${calYear}-${String(calMonth+1).padStart(2,'0')}`;
            
            // ★ キャッシュがない場合のみ取得（初回のみ）
            if (!currentEvents[monthKey] || Object.keys(currentEvents[monthKey]).length === 0) {
                console.log(`📦 月データを取得中... ${monthKey}`);
                const eventsMap = await loadMonthEvents(calYear, calMonth);
                console.log(`📦 取得結果: ${Object.keys(eventsMap).length}日分`);
                // currentEvents をクリアしてから設定
                for (const [date, events] of Object.entries(eventsMap)) {
                    currentEvents[date] = events;
                }
                currentEvents[monthKey] = { loaded: true };
                console.log(`✅ 月データをキャッシュ完了: ${monthKey}`);
            } else {
                console.log(`✅ キャッシュ済み: ${monthKey}`);
            }

            let html = weekdays.map(w => `<div class="calendar-weekday">${w}</div>`).join('');

            // 前月の日付
            for (let i = 0; i < first; i++) {
                const d = new Date(calYear, calMonth, 0).getDate() - first + i + 1;
                html += `<div class="calendar-day other-month">${d}</div>`;
            }

            // 当月の日付
            for (let d = 1; d <= last; d++) {
                const ds = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                const isToday = calYear === today.getFullYear() && calMonth === today.getMonth() && d === today.getDate();
                const isSelected = selectedDate === ds;

                // ★ イベントデータを取得（currentEvents[ds] は配列または undefined）
                const events = currentEvents[ds] || [];
                const hasOwn = events.some(e => e.type === 'own');
                const hasShared = events.some(e => e.type === 'shared');

                let cls = 'calendar-day';
                if (isToday) cls += ' today';
                if (isSelected) cls += ' selected';

                html += `<div class="${cls}" onclick="selectDate('${ds}')">${d}`;
                
                if (hasOwn && hasShared) {
                    html += `<div style="display:flex;gap:2px;position:absolute;bottom:3px;left:50%;transform:translateX(-50%);">
                                <div class="dot own" style="position:relative;bottom:0;margin:0;"></div>
                                <div class="dot shared" style="position:relative;bottom:0;margin:0;background:#ff9800 !important;"></div>
                            </div>`;
                } else if (hasOwn) {
                    html += `<div class="dot own"></div>`;
                } else if (hasShared) {
                    html += `<div class="dot shared"></div>`;
                }
                html += `</div>`;
            }

            // 翌月の日付
            const endOffset = (first + last) % 7;
            if (endOffset > 0) {
                for (let i = 1; i <= 7 - endOffset; i++) {
                    html += `<div class="calendar-day other-month">${i}</div>`;
                }
            }

            grid.innerHTML = html;
            console.log(`✅ カレンダー描画完了`);
        }



        // ============================================================
        // 月単位で予定を一括取得（高速化 + 確実にデータを返す）
        // ============================================================
        async function loadMonthEvents(year, month) {
            console.log(`🔍 loadMonthEvents(${year}, ${month}) 開始`);
            try {
                if (window.liffReadyPromise) {
                    await window.liffReadyPromise;
                }

                const { getAuth } = await import('https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js');
                const { getFirestore, collection, query, where, getDocs } = await import('https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js');
                const { getApp } = await import('https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js');
                
                const app = getApp();
                const auth = getAuth(app);
                const user = auth.currentUser;
                if (!user) {
                    console.warn('⚠️ ユーザー未ログイン');
                    return {};
                }

                const db = getFirestore(app);
                const userId = user.uid;

                // 月の開始日と終了日
                const startDate = `${year}-${String(month+1).padStart(2,'0')}-01`;
                const lastDay = new Date(year, month + 1, 0).getDate();
                const endDate = `${year}-${String(month+1).padStart(2,'0')}-${String(lastDay).padStart(2,'0')}`;

                console.log(`📅 月データ取得: ${startDate} 〜 ${endDate}`);

                // ① 自分の予定を取得（userId）
                const myQuery = query(
                    collection(db, 'events'),
                    where('userId', '==', userId),
                    where('date', '>=', startDate),
                    where('date', '<=', endDate)
                );
                const mySnapshot = await getDocs(myQuery);
                console.log(`📊 自分の予定: ${mySnapshot.size}件`);

                // ② 共有された予定を取得（sharedWith）
                const sharedQuery = query(
                    collection(db, 'events'),
                    where('sharedWith', '==', userId),
                    where('date', '>=', startDate),
                    where('date', '<=', endDate)
                );
                const sharedSnapshot = await getDocs(sharedQuery);
                console.log(`📊 共有予定: ${sharedSnapshot.size}件`);

                // 日付ごとにグループ化
                const eventsMap = {};

                // 自分の予定を追加
                mySnapshot.forEach(doc => {
                    const data = doc.data();
                    const date = data.date;
                    if (!eventsMap[date]) eventsMap[date] = [];
                    eventsMap[date].push({
                        id: doc.id,
                        time: data.time || '12:00',
                        title: data.title || 'Untitled',
                        person: data.person || 'Me',
                        note: data.note || '',
                        status: data.status || 'own',
                        type: data.type || 'own',
                        sharedWith: data.sharedWith || null,
                        role: data.role || null,
                        userId: data.userId || userId
                    });
                });

                // 共有予定を追加
                sharedSnapshot.forEach(doc => {
                    const data = doc.data();
                    const date = data.date;
                    if (!eventsMap[date]) eventsMap[date] = [];
                    eventsMap[date].push({
                        id: doc.id,
                        time: data.time || '12:00',
                        title: data.title || 'Untitled',
                        person: data.person || 'Friend',
                        note: data.note || '',
                        status: data.status || 'confirmed',
                        type: 'shared',
                        sharedWith: data.sharedWith || null,
                        role: data.role || null,
                        userId: data.userId || null
                    });
                });

                console.log(`📦 イベントマップ: ${Object.keys(eventsMap).length}日分`);
                return eventsMap;
            } catch (error) {
                console.error('❌ Load month events error:', error);
                return {};
            }
        }



        // ============================================================
        // モーダル制御（MySchedule）

        let rowCount = 1;
        const MAX_ROWS = 10;

        function getHourOptions(selected) {
            let html = '';
            for (let i = 1; i <= 12; i++) {
                const val = String(i).padStart(2, '0');
                html += `<option value="${val}" ${val === selected ? 'selected' : ''}>${val}</option>`;
            }
            return html;
        }

        function getMinuteOptions(selected) {
            let html = '';
            for (let i = 0; i < 60; i += 5) {
                const val = String(i).padStart(2, '0');
                html += `<option value="${val}" ${val === selected ? 'selected' : ''}>${val}</option>`;
            }
            return html;
        }

        function getCurrentRowData() {
            const rows = [];
            for (let i = 0; i < rowCount; i++) {
                const hourEl = document.getElementById(`time_hour_${i}`);
                const minuteEl = document.getElementById(`time_minute_${i}`);
                const ampmEl = document.getElementById(`time_ampm_${i}`);
                const titleEl = document.getElementById(`title_${i}`);
                
                if (hourEl && minuteEl && ampmEl && titleEl) {
                    rows.push({
                        hour: hourEl.value,
                        minute: minuteEl.value,
                        ampm: ampmEl.value,
                        title: titleEl.value
                    });
                } else {
                    rows.push({ hour: '09', minute: '00', ampm: 'AM', title: '' });
                }
            }
            return rows;
        }

        function renderScheduleRowsWithData(dataArray) {
            const container = document.getElementById('scheduleRows');
            let html = '';
            for (let i = 0; i < rowCount; i++) {
                const data = dataArray[i] || { hour: '09', minute: '00', ampm: 'AM', title: '' };
                html += `
                    <div class="form-row" data-row="${i}">
                        <div class="time-group">
                            <select id="time_hour_${i}">${getHourOptions(data.hour)}</select>
                            <span class="time-separator">:</span>
                            <select id="time_minute_${i}">${getMinuteOptions(data.minute)}</select>
                            <select id="time_ampm_${i}">
                                <option value="AM" ${data.ampm === 'AM' ? 'selected' : ''}>AM</option>
                                <option value="PM" ${data.ampm === 'PM' ? 'selected' : ''}>PM</option>
                            </select>
                        </div>
                        <input type="text" class="title-input" id="title_${i}" placeholder="Event title..." maxlength="100" value="${escapeHtml(data.title)}" />
                        ${rowCount > 1 ? `<button class="delete-row" onclick="removeRow(${i})"><i class="bi bi-x-circle"></i></button>` : ''}
                    </div>
                `;
            }
            container.innerHTML = html;
            document.getElementById('addRowBtn').style.display = rowCount >= MAX_ROWS ? 'none' : 'block';
        }

        function renderScheduleRows() {
            const currentData = getCurrentRowData();
            renderScheduleRowsWithData(currentData);
        }

        function openScheduleModal(dateStr) {
            if (!dateStr) {
                alert('📅 Please select a date on the calendar first.');
                return;
            }

            document.getElementById('modalDateDisplay').textContent = dateStr;
            document.getElementById('scheduleModal').classList.add('active');
            document.getElementById('modalStatus').style.display = 'none';
            document.getElementById('modalStatus').className = 'status-msg';
            
            rowCount = 1;
            renderScheduleRows();
            
            const now = new Date();
            let hour = now.getHours();
            const minute = String(Math.floor(now.getMinutes() / 5) * 5).padStart(2, '0');
            const ampm = hour >= 12 ? 'PM' : 'AM';
            hour = hour % 12;
            if (hour === 0) hour = 12;
            
            const hourEl = document.getElementById(`time_hour_0`);
            const minuteEl = document.getElementById(`time_minute_0`);
            const ampmEl = document.getElementById(`time_ampm_0`);

            if (ampmEl) ampmEl.value = ampm;

        function closeScheduleModal() {
            document.getElementById('scheduleModal').classList.remove('active');
        }

        function formatTimeForSave(hour, minute, ampm) {
            let h = parseInt(hour, 10);
            if (isNaN(h)) h = 9;
            if (ampm === 'PM' && h < 12) h += 12;
            if (ampm === 'AM' && h === 12) h = 0;
            return `${String(h).padStart(2, '0')}:${String(minute).padStart(2, '0')}`;
        }

        function addRow() {
            if (rowCount < MAX_ROWS) {
                const currentData = getCurrentRowData();
                rowCount++;
                currentData.push({ hour: '09', minute: '00', ampm: 'AM', title: '' });
                renderScheduleRowsWithData(currentData);
            }
        }

        function removeRow(index) {
            if (rowCount > 1) {
                const currentData = getCurrentRowData();
                currentData.splice(index, 1);
                rowCount--;
                renderScheduleRowsWithData(currentData);
            }
        }

        // 保存処理（MySchedule）
        // ============================================================
        async function saveSchedules() {
            const status = document.getElementById('modalStatus');
            status.style.display = 'block';
            status.className = 'status-msg';
            status.textContent = '⏳ Saving...';

            const saveBtn = document.getElementById('modalSaveBtn');
            saveBtn.disabled = true;

            try {
                if (window.liffReadyPromise) {
                    await window.liffReadyPromise;
                }

                const dateStr = document.getElementById('modalDateDisplay').textContent;
                
                const schedules = [];
                
                for (let i = 0; i < rowCount; i++) {
                    const hour = document.getElementById(`time_hour_${i}`).value || '09';
                    const minute = document.getElementById(`time_minute_${i}`).value || '00';
                    const ampm = document.getElementById(`time_ampm_${i}`).value;
                    const title = document.getElementById(`title_${i}`).value.trim();
                    
                    if (!title) {
                        status.className = 'status-msg error';
                        status.textContent = `⚠️ Please enter a title for row ${i + 1}.`;
                        saveBtn.disabled = false;
                        return;
                    }
                    
                    const time = formatTimeForSave(hour, minute, ampm);
                    schedules.push({ time, title });
                }

                const { getAuth } = await import('https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js');
                const { getApp } = await import('https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js');
                
                const app = getApp();
                const auth = getAuth(app);
                const user = auth.currentUser;

                if (!user) {
                    status.className = 'status-msg error';
                    status.textContent = '❌ Please log in to save schedules.';
                    saveBtn.disabled = false;
                    return;
                }

                const idToken = await user.getIdToken();

                const response = await fetch('https://us-central1-tomoche.cloudfunctions.net/saveMySchedule', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${idToken}`
                    },
                    body: JSON.stringify({
                        date: dateStr,
                        schedules: schedules,
                        userName: window.currentUser?.displayName || 'Me'
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.error || `HTTP ${response.status}`);
                }

                status.className = 'status-msg success';
                status.textContent = `✅ ${schedules.length} schedule(s) saved successfully!`;

                currentEvents[dateStr] = await loadEventsFromFirestore(dateStr);
                await renderCalendar();
                await renderEvents(dateStr);

                setTimeout(closeScheduleModal, 1500);

            } catch (error) {
                console.error('Save error:', error);
                status.className = 'status-msg error';
                status.textContent = `❌ Failed to save: ${error.message}`;
            } finally {
                saveBtn.disabled = false;
            }
        }

                if (!user) {
                    status.className = 'status-msg error';
                    status.textContent = '❌ Please log in.';
                    sendBtn.disabled = false;
                    return;
                }

                const idToken = await user.getIdToken();

                const response = await fetch('https://us-central1-tomoche.cloudfunctions.net/sendFriendEvent', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${idToken}`
                    },
                    body: JSON.stringify({
                        friendId: friendId,
                        date: date,
                        time: time,
                        title: title,
                        note: note
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || `HTTP ${response.status}`);
                }

                status.className = 'status-msg success';
                status.textContent = `✅ ${data.message}`;
                setTimeout(closeFriendEventModal, 2000);

            } catch (error) {
                console.error('Send friend event error:', error);
                status.className = 'status-msg error';
                status.textContent = `❌ Failed to send: ${error.message}`;
            } finally {
                sendBtn.disabled = false;
            }
        }



        // ============================================================
        // 友達からのイベント申請一覧を取得（pending のみ + キャンセルも表示）
        // ============================================================
        let pendingRequests = [];

        async function loadFriendRequests() {
            try {
                if (window.liffReadyPromise) {
                    await window.liffReadyPromise;
                }

                const { getAuth } = await import('https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js');
                const { getFirestore, collection, query, where, getDocs } = await import('https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js');
                const { getApp } = await import('https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js');
                
                const app = getApp();
                const auth = getAuth(app);
                const user = auth.currentUser;
                if (!user) return [];

                const db = getFirestore(app);
                const requests = [];

                // ★ 修正: pending リクエストを取得（[CANCEL] も含む）
                const pendingQuery = query(
                    collection(db, 'friendEvents'),
                    where('toUserId', '==', user.uid),
                    where('status', '==', 'pending')
                );
                const pendingSnapshot = await getDocs(pendingQuery);
                pendingSnapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    // ★ [CANCEL] が含まれているかチェック
                    const isCancel = data.title && data.title.startsWith('[CANCEL]');
                    requests.push({
                        id: docSnap.id,
                        fromUserId: data.fromUserId,
                        fromUserName: data.fromUserName || 'Friend',
                        date: data.date,
                        time: data.time,
                        title: data.title,
                        note: data.note || '',
                        status: data.status,
                        createdAt: data.createdAt,
                        isCancel: isCancel
                    });
                });

                // 日付順にソート（新しい順）
                requests.sort((a, b) => {
                    return new Date(b.createdAt) - new Date(a.createdAt);
                });

                pendingRequests = requests;
                updateRequestBadge(requests.length);
                return requests;
            } catch (error) {
                console.error('Load friend requests error:', error);
                return [];
            }
        }





        function updateRequestBadge(count) {
            const badge = document.getElementById('requestBadge');
            if (count > 0) {
                badge.style.display = 'inline';
                badge.textContent = count;
            } else {
                badge.style.display = 'none';
            }
        }



        // ============================================================
        // 申請一覧モーダルを開く（pending を表示 + キャンセル表示）
        // ============================================================
        async function openFriendRequestsModal() {
            const modal = document.getElementById('friendRequestsModal');
            const container = document.getElementById('friendRequestList');
            
            modal.classList.add('active');
            container.innerHTML = '<div style="text-align:center;color:#bbb;padding:20px 0;font-size:13px;">Loading requests...</div>';

            const requests = await loadFriendRequests();
            
            if (requests.length === 0) {
                container.innerHTML = `<div style="text-align:center;color:#bbb;padding:20px 0;font-size:13px;">📭 No pending requests</div>`;
                return;
            }

            // ★ 通常のリクエストとキャンセルリクエストに分ける
            const normalRequests = requests.filter(r => !r.isCancel);
            const cancelRequests = requests.filter(r => r.isCancel);

            let html = '';

            // 通常のリクエスト（Pending）
            if (normalRequests.length > 0) {
                html += `<div style="font-weight:600;font-size:14px;color:#333;margin-bottom:8px;">📩 Event Requests</div>`;
                html += normalRequests.map(req => {
                    const displayTime = formatTimeDisplay(req.time);
                    return `
                        <div class="request-item">
                            <div style="display:flex;justify-content:space-between;align-items:start;flex-wrap:wrap;gap:8px;">
                                <div style="flex:1;">
                                    <div style="font-weight:600;font-size:15px;">${escapeHtml(req.title)}</div>
                                    <div style="font-size:13px;color:#666;">📅 ${escapeHtml(req.date)} ${displayTime}</div>
                                    <div style="font-size:12px;color:#888;">👤 From: ${escapeHtml(req.fromUserName)}</div>
                                    ${req.note ? `<div style="font-size:12px;color:#999;margin-top:4px;">📝 ${escapeHtml(req.note)}</div>` : ''}
                                </div>
                                <div style="display:flex;gap:8px;flex-shrink:0;">
                                    <button class="btn btn-success btn-sm" onclick="handleFriendRequest('${req.id}', 'confirmed')" style="padding:6px 16px;border:none;border-radius:999px;background:#06C755;color:white;font-weight:600;cursor:pointer;">Accept</button>
                                    <button class="btn btn-danger btn-sm" onclick="handleFriendRequest('${req.id}', 'rejected')" style="padding:6px 16px;border:none;border-radius:999px;background:#e53935;color:white;font-weight:600;cursor:pointer;">Decline</button>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            // ★ キャンセルリクエスト（Cancel Requests）
            if (cancelRequests.length > 0) {
                html += `<div style="font-weight:600;font-size:14px;color:#e53935;margin-top:16px;margin-bottom:8px;">❌ Cancellation Requests</div>`;
                html += cancelRequests.map(req => {
                    const displayTime = formatTimeDisplay(req.time);
                    // [CANCEL] を表示用に整形
                    const displayTitle = req.title.replace('[CANCEL] ', '');
                    return `
                        <div class="request-item" style="background:#fff5f5;border:1px solid #ffcdd2;">
                            <div style="display:flex;justify-content:space-between;align-items:start;flex-wrap:wrap;gap:8px;">
                                <div style="flex:1;">
                                    <div style="font-weight:600;font-size:15px;color:#e53935;">❌ Cancel: ${escapeHtml(displayTitle)}</div>
                                    <div style="font-size:13px;color:#666;">📅 ${escapeHtml(req.date)} ${displayTime}</div>
                                    <div style="font-size:12px;color:#888;">👤 From: ${escapeHtml(req.fromUserName)}</div>
                                    ${req.note ? `<div style="font-size:12px;color:#999;margin-top:4px;">📝 ${escapeHtml(req.note)}</div>` : ''}
                                </div>
                                <div>
                                    <button class="btn btn-success btn-sm" onclick="handleCancellation('${req.id}', '${req.fromUserId}')" style="padding:6px 16px;border:none;border-radius:999px;background:#06C755;color:white;font-weight:600;cursor:pointer;">Accept Cancellation</button>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            container.innerHTML = html || `<div style="text-align:center;color:#bbb;padding:20px 0;font-size:13px;">📭 No requests</div>`;
        }


        // ============================================================
        // 友達からのイベント申請を処理（承諾/拒否）
        // ============================================================
        async function handleFriendRequest(requestId, status) {
            if (status === 'rejected') {
                if (!confirm('Decline this event request?')) return;
            } else {
                if (!confirm('Accept this event request?')) return;
            }

            try {
                if (window.liffReadyPromise) {
                    await window.liffReadyPromise;
                }

                const { getAuth } = await import('https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js');
                const { getFirestore, doc, updateDoc, getDoc, collection, addDoc } = await import('https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js');
                const { getApp } = await import('https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js');
                
                const app = getApp();
                const auth = getAuth(app);
                const user = auth.currentUser;
                if (!user) {
                    alert('Please log in.');
                    return;
                }

                const db = getFirestore(app);

                const requestRef = doc(db, 'friendEvents', requestId);
                const requestSnap = await getDoc(requestRef);
                const requestData = requestSnap.data();

                await updateDoc(requestRef, {
                    status: status,
                    updatedAt: new Date().toISOString()
                });

                if (status === 'confirmed') {
                    const eventsRef = collection(db, 'events');

                    // ★ 修正：Firebase Authのuser.displayNameは常にnull/undefinedのため
                    //   （カスタムトークンでのサインインでは設定されない）、
                    //   代わりに信頼できる window.currentUser.displayName（LIFFプロフィール由来）を使う
                    const myDisplayName = window.currentUser?.displayName || 'Me';

                    // 自分（承諾者）のカレンダーに追加
                    // role: 'acceptor' → 直接削除が可能な側
                    await addDoc(eventsRef, {
                        userId: user.uid,
                        date: requestData.date,
                        time: requestData.time,
                        title: `[With ${requestData.fromUserName}] ${requestData.title}`,
                        person: requestData.fromUserName,
                        type: 'shared',
                        status: 'confirmed',
                        sharedWith: requestData.fromUserId,
                        role: 'acceptor',
                        createdAt: new Date().toISOString(),
                        updatedAt: new Date().toISOString()
                    });

                    // 友達（依頼者）のカレンダーに追加
                    // role: 'requester' → 削除リクエストのみ可能な側
                    await addDoc(eventsRef, {
                        userId: requestData.fromUserId,
                        date: requestData.date,
                        time: requestData.time,
                        title: `[With ${myDisplayName}] ${requestData.title}`,
                        person: myDisplayName,
                        type: 'shared',
                        status: 'confirmed',
                        sharedWith: user.uid,
                        role: 'requester',
                        createdAt: new Date().toISOString(),
                        updatedAt: new Date().toISOString()
                    });

                    alert('✅ Event confirmed! Added to both calendars.');
                } else {
                    alert('❌ Event declined.');
                }

                await loadFriendRequests();
                openFriendRequestsModal();

                if (selectedDate) {
                    await renderCalendar();
                    await renderEvents(selectedDate);
                }

            } catch (error) {
                console.error('Handle friend request error:', error);
                alert('Failed to process request. Please try again.');
            }
        }



        // ============================================================
        // キャンセルリクエストを承認（デバッグ版）
        // ============================================================
        async function handleCancellation(requestId, friendId) {
            if (!confirm('Accept this cancellation request? Both calendars will be updated.')) return;

            try {
                if (window.liffReadyPromise) {
                    await window.liffReadyPromise;
                }

                const { getAuth } = await import('https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js');
                const { getFirestore, doc, updateDoc, getDoc, collection, query, where, getDocs, deleteDoc } = await import('https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js');
                const { getApp } = await import('https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js');
                
                const app = getApp();
                const auth = getAuth(app);
                const user = auth.currentUser;
                if (!user) {
                    alert('Please log in.');
                    return;
                }

                console.log('👤 現在のユーザーUID:', user.uid);
                console.log('👤 友達のUID (friendId):', friendId);

                const db = getFirestore(app);

                // 1. リクエストを取得
                const requestRef = doc(db, 'friendEvents', requestId);
                const requestSnap = await getDoc(requestRef);
                if (!requestSnap.exists) {
                    alert('Request not found.');
                    return;
                }
                const requestData = requestSnap.data();
                console.log('📄 キャンセルリクエストデータ:', requestData);

                // 2. キャンセルリクエストを承認済みに更新
                await updateDoc(requestRef, {
                    status: 'approved',
                    updatedAt: new Date().toISOString()
                });

                // 3. 削除するイベントのタイトルを取得
                let cleanTitle = requestData.title.replace('[CANCEL] ', '').trim();
                cleanTitle = cleanTitle.replace(/^\[With\s+.+?\]\s*/, '').trim();
                console.log(`🗑️ 削除対象タイトル: "${cleanTitle}"`);

                // 4. 自分のイベントを削除
                console.log(`🔍 自分のイベント検索: userId=${user.uid}, date=${requestData.date}, time=${requestData.time}`);
                const myEventsQuery = query(
                    collection(db, 'events'),
                    where('userId', '==', user.uid),
                    where('date', '==', requestData.date),
                    where('time', '==', requestData.time)
                );
                const myEvents = await getDocs(myEventsQuery);
                console.log(`📊 自分のイベント: ${myEvents.size}件`);
                for (const docSnap of myEvents.docs) {
                    const data = docSnap.data();
                    console.log(`   📄 ${docSnap.id}: ${data.title}`);
                    if (data.title && data.title.includes(cleanTitle)) {
                        await deleteDoc(docSnap.ref);
                        console.log(`   ✅ 自分のイベント削除完了: ${docSnap.id}`);
                    }
                }

                // 5. 友達のイベントを削除
                console.log(`🔍 友達のイベント検索: userId=${friendId}, date=${requestData.date}, time=${requestData.time}`);
                const friendEventsQuery = query(
                    collection(db, 'events'),
                    where('userId', '==', friendId),
                    where('date', '==', requestData.date),
                    where('time', '==', requestData.time)
                );
                const friendEvents = await getDocs(friendEventsQuery);
                console.log(`📊 友達のイベント: ${friendEvents.size}件`);
                for (const docSnap of friendEvents.docs) {
                    const data = docSnap.data();
                    console.log(`   📄 ${docSnap.id}: ${data.title}`);
                    if (data.title && data.title.includes(cleanTitle)) {
                        await deleteDoc(docSnap.ref);
                        console.log(`   ✅ 友達のイベント削除完了: ${docSnap.id}`);
                    }
                }

                alert('✅ Cancellation accepted. Events removed from both calendars.');

                // 6. モーダルを閉じて再読み込み
                await loadFriendRequests();
                await openFriendRequestsModal();
                if (selectedDate) {
                    await renderCalendar();
                    await renderEvents(selectedDate);
                }

            } catch (error) {
                console.error('❌ Handle cancellation error:', error);
                alert('Failed to process cancellation. Please try again.');
            }
        }

        // ============================================================
        // 申請一覧モーダルを閉じる（正しい定義）
        // ============================================================
        function closeFriendRequestsModal() {
            const modal = document.getElementById('friendRequestsModal');
            if (modal) {
                modal.classList.remove('active');
            }
        }

        // ============================================================
        // イベントリスナー（修正済み）
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            // MySchedule
            document.getElementById('addOwnEventBtn').addEventListener('click', function() {
                openScheduleModal(selectedDate);
            });
            document.getElementById('modalCancelBtn').addEventListener('click', closeScheduleModal);
            document.getElementById('addRowBtn').addEventListener('click', addRow);
            document.getElementById('modalSaveBtn').addEventListener('click', saveSchedules);
            document.getElementById('scheduleModal').addEventListener('click', function(e) {
                if (e.target === this) closeScheduleModal();
            });

            // With Friend
            document.getElementById('addSharedEventBtn').addEventListener('click', function() {
                openFriendEventModal();
            });
            document.getElementById('friendEventCancelBtn').addEventListener('click', closeFriendEventModal);
            document.getElementById('friendEventSendBtn').addEventListener('click', sendFriendEvent);
            document.getElementById('friendEventModal').addEventListener('click', function(e) {
                if (e.target === this) closeFriendEventModal();
            });

            // 申請一覧
            document.getElementById('viewRequestsBtn').addEventListener('click', function() {
                openFriendRequestsModal();
            });
            document.getElementById('friendRequestsCloseBtn').addEventListener('click', closeFriendRequestsModal);
            document.getElementById('friendRequestsModal').addEventListener('click', function(e) {
                if (e.target === this) closeFriendRequestsModal();
            });

            if (typeof renderPage === 'function') {
                renderPage('Calendar', '', 'calendar');
            }

            // ★ 修正: カレンダー描画を確実に実行
            setTimeout(async () => {
                console.log('🔄 カレンダー初期描画開始');
                const today = new Date();
                selectedDate = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
                
                // ★ 最初に月データをロード
                console.log('📦 月データを事前ロード');
                const monthKey = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}`;
                const eventsMap = await loadMonthEvents(today.getFullYear(), today.getMonth());
                for (const [date, events] of Object.entries(eventsMap)) {
                    currentEvents[date] = events;
                }
                currentEvents[monthKey] = { loaded: true };
                console.log(`✅ 月データ事前ロード完了: ${Object.keys(eventsMap).length}日分`);
                
                // ★ カレンダー描画
                await renderCalendar();
                await renderEvents(selectedDate);
                await loadFriendRequests();
                console.log('✅ カレンダー初期描画完了');
            }, 500);
        });




    </script>
