<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Add Friends - Tomosche</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://static.line-scdn.net/liff/edge/2.1/sdk.js"></script>
    <script src="js/auth-guard.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        .qr-container { background: white; border-radius: 24px; padding: 32px 20px; text-align: center; border: 1px solid #f0f4f8; margin-top: 12px; }
        #qrcode { display: inline-block; background: white; padding: 12px; border-radius: 16px; border: 1px solid #f0f4f8; }
        .send-btn { background: #06C755; color: white; border: none; padding: 14px; border-radius: 999px; font-size: 16px; font-weight: 600; width: 100%; margin-top: 16px; cursor: pointer; }
        .send-btn:hover { background: #049a44; }
        .qr-note { font-size: 12px; color: #aaa; margin-top: 16px; }
        .status-msg { margin-top: 16px; padding: 12px; border-radius: 12px; text-align: center; display: none; font-weight: 600; }
        .status-msg.success { display: block; background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
        .status-msg.error { display: block; background: #ffebee; color: #c62828; border: 1px solid #ef9a9a; }
        .status-msg.info { display: block; background: #e3f2fd; color: #1565c0; border: 1px solid #90caf9; }
        .status-msg.debug { display: block; background: #fff3e0; color: #e65100; border: 1px solid #ffcc80; font-family: monospace; font-size: 12px; text-align: left; white-space: pre-wrap; word-break: break-all; max-height: 200px; overflow-y: auto; }
        .my-id { font-size: 12px; color: #888; margin-top: 8px; word-break: break-all; }
        .debug-toggle { font-size: 11px; color: #999; cursor: pointer; text-decoration: underline; margin-top: 8px; display: inline-block; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="container py-3">
            <div class="d-flex align-items-center mb-2">
                <button class="back-btn" onclick="history.back()"><i class="bi bi-arrow-left"></i></button>
                <h1 class="page-title">Add Friends</h1>
            </div>
            <div class="qr-container">
                <h5 style="font-weight:600;margin-bottom:8px;">Invite via QR Code</h5>
                <p style="font-size:14px;color:#888;margin-bottom:20px;">Have your friend scan this QR code</p>
                <div id="qrcode"></div>
                <button class="send-btn" id="sendBtn"><i class="bi bi-line me-2"></i>Send via LINE</button>
                <div class="qr-note">When scanned, your friend will be automatically added</div>
                <div class="my-id">Your ID: <span id="myUserId">Loading...</span></div>
                <div style="margin-top:8px;">
                    <span class="debug-toggle" onclick="toggleDebug()">🔍 Show Debug Info</span>
                </div>
            </div>
            <div class="status-msg" id="statusMsg"></div>
            <div class="status-msg debug" id="debugMsg" style="display:none;"></div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
    <script src="js/template.js"></script>
    <script>
        let debugVisible = false;

        document.addEventListener('DOMContentLoaded', async function() {
            generateQRCode();
            displayMyUserId();

            if (window.liffReadyPromise) {
                await window.liffReadyPromise;
            }
            await sendAutoFriendRequest();

            if (typeof renderPage === 'function') {
                renderPage('Add Friends', '', 'add');
            }
        });

        function toggleDebug() {
            const el = document.getElementById('debugMsg');
            debugVisible = !debugVisible;
            el.style.display = debugVisible ? 'block' : 'none';
        }

        function showDebug(message) {
            const el = document.getElementById('debugMsg');
            el.textContent += message + '\n';
            if (debugVisible) {
                el.style.display = 'block';
            }
            console.log(message);
        }

        async function generateQRCode() {
            try {
                if (window.liffReadyPromise) {
                    await window.liffReadyPromise;
                }
                const userId = window.currentUser?.userId || '';
                const url = `https://tomosche.com/add.html?friendId=${userId}`;
                console.log('📱 QR Code URL:', url);
                try {
                    new QRCode(document.getElementById('qrcode'), {
                        text: url,
                        width: 200,
                        height: 200
                    });
                } catch(e) {
                    console.error('QR生成エラー:', e);
                }
            } catch (e) {
                console.error('QR生成待機エラー:', e);
            }
        }

        async function displayMyUserId() {
            try {
                if (window.liffReadyPromise) {
                    await window.liffReadyPromise;
                }
                if (window.currentUser && window.currentUser.userId) {
                    document.getElementById('myUserId').textContent = window.currentUser.userId;
                } else {
                    document.getElementById('myUserId').textContent = 'Not logged in';
                }
            } catch (e) {
                console.error('User ID display error:', e);
                document.getElementById('myUserId').textContent = 'Error loading';
            }
        }

        document.getElementById('sendBtn').addEventListener('click', function() {
            const userId = window.currentUser?.userId || '';
            const url = `https://tomosche.com/add.html?friendId=${userId}`;
            if (typeof liff !== 'undefined' && liff.isLoggedIn()) {
                liff.sendMessages([{ type: 'text', text: `🌱 Tomosche に招待します！\n${url}` }])
                    .then(() => liff.closeWindow()).catch(() => alert('送信に失敗しました'));
            } else {
                alert('LINEにログインしてください');
            }
        });

        // ============================================================
        // ✅ 友達追加（Cloud Functions 経由 + デバッグ機能）
        // ============================================================
        async function sendAutoFriendRequest() {
            showDebug('=== 友達追加処理開始 ===');
            
            try {
                const urlParams = new URLSearchParams(window.location.search);
                const friendId = urlParams.get('friendId');

                showDebug(`📌 URLパラメータ friendId: ${friendId || '(なし)'}`);

                if (!friendId) {
                    showDebug('ℹ️ friendIdがありません。QRコード表示モードです。');
                    return;
                }

                const { getAuth } = await import('https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js');
                const { initializeApp, getApps, getApp } = await import('https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js');

                const firebaseConfig = {
                    apiKey: 'AIzaSyAutsnScMxkcm6UXv0vhLs6hVDY_rxhLP0',
                    authDomain: 'tomoche.firebaseapp.com',
                    projectId: 'tomoche',
                    storageBucket: 'tomoche.firebasestorage.app',
                    messagingSenderId: '687415158427',
                    appId: '1:687415158427:web:1efc4417146176da74c83e'
                };
                const app = getApps().length > 0 ? getApp() : initializeApp(firebaseConfig);
                const auth = getAuth(app);
                const user = auth.currentUser;

                showDebug(`👤 認証状態: ${user ? 'ログイン中 (UID: ' + user.uid + ')' : '未ログイン'}`);

                if (!user) {
                    showStatus('Please log in to add friends.', 'error');
                    showDebug('❌ ユーザーが未ログインです');
                    return;
                }

                if (friendId === user.uid) {
                    showStatus('You cannot add yourself.', 'error');
                    showDebug('❌ 自分自身を追加しようとしています');
                    return;
                }

                const idToken = await user.getIdToken();
                showDebug('🔑 IDトークン取得完了');

                const apiUrl = 'https://us-central1-tomoche.cloudfunctions.net/addFriendV2';
                showDebug(`📡 APIリクエスト: ${apiUrl}`);
                showDebug(`📤 送信データ: { friendId: "${friendId}" }`);

                const res = await fetch(apiUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${idToken}`
                    },
                    body: JSON.stringify({ friendId })
                });

                showDebug(`📥 レスポンスステータス: ${res.status}`);

                const data = await res.json();
                showDebug(`📦 レスポンスボディ: ${JSON.stringify(data, null, 2)}`);

                if (!res.ok) {
                    throw new Error(data.error || `HTTP ${res.status}`);
                }

                if (data.alreadyFriends) {
                    showStatus(`✅ Already friends with ${data.friendName}! 🎉`, 'info');
                    showDebug(`✅ 既に友達です: ${data.friendName}`);
                } else {
                    showStatus(`✅ ${data.friendName} added successfully! 🎉`, 'success');
                    showDebug(`✅ 友達追加成功: ${data.friendName}`);
                    localStorage.setItem('tomosche_friends_updated', 'true');
                    showDebug('📌 更新フラグを設定しました (tomosche_friends_updated=true)');
                }

            } catch (error) {
                console.error('Add friend error:', error);
                showStatus('❌ Failed to add friend. Please try again.', 'error');
                showDebug(`❌ エラー: ${error.message}`);
                showDebug(`❌ スタック: ${error.stack || '(なし)'}`);
            }

            showDebug('=== 友達追加処理終了 ===');
        }

        function showStatus(message, type) {
            const el = document.getElementById('statusMsg');
            el.textContent = message;
            el.className = 'status-msg ' + type;
        }
    </script>
</body>
</html>
