<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Add Friends - Tomosche</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://static.line-scdn.net/liff/edge/2.1/sdk.js"></script>
    <script src="js/auth-guard.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        .qr-container { background: white; border-radius: 24px; padding: 32px 20px; text-align: center; border: 1px solid #f0f4f8; margin-top: 12px; }
        #qrcode { display: inline-block; background: white; padding: 12px; border-radius: 16px; border: 1px solid #f0f4f8; }
        .send-btn { background: #06C755; color: white; border: none; padding: 14px; border-radius: 999px; font-size: 16px; font-weight: 600; width: 100%; margin-top: 16px; cursor: pointer; }
        .send-btn:hover { background: #049a44; }
        .qr-note { font-size: 12px; color: #aaa; margin-top: 16px; }
        .friend-requests { margin-top: 20px; background: white; border-radius: 16px; padding: 16px; border: 1px solid #f0f4f8; }
        .friend-request-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f5f5f5; }
        .friend-request-item:last-child { border-bottom: none; }
        .request-actions { display: flex; gap: 8px; }
        .request-actions button { border: none; border-radius: 999px; padding: 4px 16px; font-size: 12px; font-weight: 600; cursor: pointer; }
        .btn-accept { background: #06C755; color: white; }
        .btn-accept:hover { background: #049a44; }
        .btn-reject { background: #f0f4f8; color: #666; }
        .btn-reject:hover { background: #e53935; color: white; }
        .request-status { font-size: 12px; color: #ff9800; }
        .request-status.accepted { color: #06C755; }
        .request-status.rejected { color: #e53935; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="container py-3">
            <div class="d-flex align-items-center mb-2">
                <button class="back-btn" onclick="history.back()"><i class="bi bi-arrow-left"></i></button>
                <h1 class="page-title">Add Friends</h1>
            </div>
            <div class="qr-container">
                <h5 style="font-weight:600;margin-bottom:8px;">Invite via QR Code</h5>
                <p style="font-size:14px;color:#888;margin-bottom:20px;">Have your friend scan this QR code</p>
                <div id="qrcode"></div>
                <button class="send-btn" id="sendBtn"><i class="bi bi-line me-2"></i>Send via LINE</button>
                <div class="qr-note">When scanned, your friend will be automatically added</div>
            </div>

            <!-- ✅ 友達リクエスト一覧 -->
            <div class="friend-requests" id="friendRequests">
                <h6 style="font-weight:600;margin-bottom:12px;">📩 Friend Requests</h6>
                <div id="requestList"><div style="text-align:center;color:#bbb;padding:12px 0;font-size:13px;">No pending requests</div></div>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
    <script src="js/template.js"></script>
    <script>
        // ============================================================
        // QRコード生成
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            const url = 'https://tomosche.com/add.html';
            try {
                new QRCode(document.getElementById('qrcode'), {
                    text: url,
                    width: 200,
                    height: 200
                });
            } catch(e) {
                console.error('QR生成エラー:', e);
            }

            // LINEで送信
            document.getElementById('sendBtn').addEventListener('click', function() {
                if (typeof liff !== 'undefined' && liff.isLoggedIn()) {
                    liff.sendMessages([{ type: 'text', text: `🌱 Tomosche に招待します！\n${url}` }])
                        .then(() => liff.closeWindow()).catch(() => alert('送信に失敗しました'));
                } else {
                    alert('LINEにログインしてください');
                }
            });

            // ✅ 友達リクエストを読み込む
            loadFriendRequests();

            // ✅ 友達リクエストを監視（5秒ごと）
            setInterval(loadFriendRequests, 5000);
        });

        // ============================================================
        // ✅ 友達リクエスト一覧を読み込む
        // ============================================================
        async function loadFriendRequests() {
            try {
                const { getAuth } = await import('https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js');
                const { getFirestore, collection, query, where, getDocs, doc, updateDoc } = await import('https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js');
                
                const auth = getAuth();
                const user = auth.currentUser;
                if (!user) return;

                const { initializeApp, getApps, getApp } = await import('https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js');
                const firebaseConfig = {
                    apiKey: 'AIzaSyAutsnScMxkcm6UXv0vhLs6hVDY_rxhLP0',
                    authDomain: 'tomoche.firebaseapp.com',
                    projectId: 'tomoche',
                    storageBucket: 'tomoche.firebasestorage.app',
                    messagingSenderId: '687415158427',
                    appId: '1:687415158427:web:1efc4417146176da74c83e'
                };
                const app = getApps().length > 0 ? getApp() : initializeApp(firebaseConfig);
                const db = getFirestore(app);

                // 自分宛の保留中のリクエストを取得
                const q = query(
                    collection(db, 'friendRequests'),
                    where('toUserId', '==', user.uid),
                    where('status', '==', 'pending')
                );
                const snapshot = await getDocs(q);
                const container = document.getElementById('requestList');

                if (snapshot.empty) {
                    container.innerHTML = `<div style="text-align:center;color:#bbb;padding:12px 0;font-size:13px;">No pending requests</div>`;
                    return;
                }

                let html = '';
                for (const doc of snapshot.docs) {
                    const data = doc.data();
                    // 送信者のユーザー情報を取得
                    const userRef = await db.collection('users').doc(data.fromUserId).get();
                    const userName = userRef.exists ? userRef.data().displayName : 'Unknown User';
                    html += `
                        <div class="friend-request-item" data-id="${doc.id}">
                            <div>
                                <strong>${escapeHtml(userName)}</strong>
                                <span style="font-size:12px;color:#888;margin-left:8px;">wants to add you</span>
                            </div>
                            <div class="request-actions">
                                <button class="btn-accept" onclick="handleRequest('${doc.id}', 'accepted')">Accept</button>
                                <button class="btn-reject" onclick="handleRequest('${doc.id}', 'rejected')">Decline</button>
                            </div>
                        </div>
                    `;
                }
                container.innerHTML = html;

            } catch (error) {
                console.error('Load friend requests error:', error);
            }
        }

        // ============================================================
        // ✅ 友達リクエストを処理（承諾/拒否）
        // ============================================================
        async function handleRequest(requestId, status) {
            try {
                const { getAuth } = await import('https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js');
                const { getFirestore, doc, updateDoc, collection, addDoc } = await import('https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js');
                
                const auth = getAuth();
                const user = auth.currentUser;
                if (!user) {
                    alert('Please log in.');
                    return;
                }

                const { initializeApp, getApps, getApp } = await import('https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js');
                const firebaseConfig = {
                    apiKey: 'AIzaSyAutsnScMxkcm6UXv0vhLs6hVDY_rxhLP0',
                    authDomain: 'tomoche.firebaseapp.com',
                    projectId: 'tomoche',
                    storageBucket: 'tomoche.firebasestorage.app',
                    messagingSenderId: '687415158427',
                    appId: '1:687415158427:web:1efc4417146176da74c83e'
                };
                const app = getApps().length > 0 ? getApp() : initializeApp(firebaseConfig);
                const db = getFirestore(app);

                // リクエストを更新
                const requestRef = doc(db, 'friendRequests', requestId);
                await updateDoc(requestRef, {
                    status: status,
                    updatedAt: new Date().toISOString()
                });

                if (status === 'accepted') {
                    // リクエストデータを取得
                    const requestDoc = await requestRef.get();
                    const data = requestDoc.data();
                    
                    // friendships に双方のレコードを作成
                    await addDoc(collection(db, 'friendships'), {
                        userId: data.fromUserId,
                        friendId: user.uid,
                        status: 'shared',
                        createdAt: new Date().toISOString()
                    });
                    await addDoc(collection(db, 'friendships'), {
                        userId: user.uid,
                        friendId: data.fromUserId,
                        status: 'shared',
                        createdAt: new Date().toISOString()
                    });

                    alert('✅ Friend request accepted!');
                } else {
                    alert('❌ Friend request declined.');
                }

                // リクエスト一覧を再読み込み
                loadFriendRequests();

            } catch (error) {
                console.error('Handle request error:', error);
                alert('Failed to process request. Please try again.');
            }
        }
    </script>
</body>
</html>
