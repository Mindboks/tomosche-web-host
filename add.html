<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Add Friends - Tomosche</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://static.line-scdn.net/liff/edge/2.1/sdk.js"></script>
    <script src="js/auth-guard.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        .qr-container { background: white; border-radius: 24px; padding: 32px 20px; text-align: center; border: 1px solid #f0f4f8; margin-top: 12px; }
        #qrcode { display: inline-block; background: white; padding: 12px; border-radius: 16px; border: 1px solid #f0f4f8; }
        .send-btn { background: #06C755; color: white; border: none; padding: 14px; border-radius: 999px; font-size: 16px; font-weight: 600; width: 100%; margin-top: 16px; cursor: pointer; }
        .send-btn:hover { background: #049a44; }
        .qr-note { font-size: 12px; color: #aaa; margin-top: 16px; }
        .status-msg { margin-top: 16px; padding: 12px; border-radius: 12px; text-align: center; display: none; font-weight: 600; }
        .status-msg.success { display: block; background: #e8f5e9; color: #2e7d32; }
        .status-msg.error { display: block; background: #ffebee; color: #c62828; }
        .status-msg.info { display: block; background: #e3f2fd; color: #1565c0; }
        .friend-requests { margin-top: 20px; background: white; border-radius: 16px; padding: 16px; border: 1px solid #f0f4f8; }
        .friend-request-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f5f5f5; }
        .friend-request-item:last-child { border-bottom: none; }
        .request-status { font-size: 12px; padding: 2px 12px; border-radius: 999px; }
        .request-status.pending { background: #fff3e0; color: #e65100; }
        .request-status.accepted { background: #e8f5e9; color: #2e7d32; }
        .request-status.rejected { background: #ffebee; color: #c62828; }
        .my-id { font-size: 12px; color: #888; margin-top: 8px; word-break: break-all; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="container py-3">
            <div class="d-flex align-items-center mb-2">
                <button class="back-btn" onclick="history.back()"><i class="bi bi-arrow-left"></i></button>
                <h1 class="page-title">Add Friends</h1>
            </div>
            <div class="qr-container">
                <h5 style="font-weight:600;margin-bottom:8px;">Invite via QR Code</h5>
                <p style="font-size:14px;color:#888;margin-bottom:20px;">Have your friend scan this QR code</p>
                <div id="qrcode"></div>
                <button class="send-btn" id="sendBtn"><i class="bi bi-line me-2"></i>Send via LINE</button>
                <div class="qr-note">When scanned, your friend will be automatically added</div>
                <div class="my-id">Your ID: <span id="myUserId">Loading...</span></div>
            </div>

            <!-- ステータスメッセージ -->
            <div class="status-msg" id="statusMsg"></div>

            <!-- 友達リクエスト一覧 -->
            <div class="friend-requests" id="friendRequests">
                <h6 style="font-weight:600;margin-bottom:12px;">📩 Friend Requests</h6>
                <div id="requestList"><div style="text-align:center;color:#bbb;padding:12px 0;font-size:13px;">No pending requests</div></div>
            </div>

            <!-- 友達一覧 -->
            <div class="friend-requests" id="myFriends" style="margin-top:12px;">
                <h6 style="font-weight:600;margin-bottom:12px;">👥 My Friends</h6>
                <div id="friendsList"><div style="text-align:center;color:#bbb;padding:12px 0;font-size:13px;">No friends yet</div></div>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
    <script src="js/template.js"></script>
    <script>
        // ============================================================
        // QRコード生成
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            const url = 'https://tomosche.com/add.html';
            try {
                new QRCode(document.getElementById('qrcode'), {
                    text: url,
                    width: 200,
                    height: 200
                });
            } catch(e) {
                console.error('QR生成エラー:', e);
            }

            // 自分のユーザーIDを表示
            if (window.currentUser) {
                document.getElementById('myUserId').textContent = window.currentUser.userId || 'Unknown';
            }

            // LINEで送信
            document.getElementById('sendBtn').addEventListener('click', function() {
                if (typeof liff !== 'undefined' && liff.isLoggedIn()) {
                    liff.sendMessages([{ type: 'text', text: `🌱 Tomosche に招待します！\n${url}` }])
                        .then(() => liff.closeWindow()).catch(() => alert('送信に失敗しました'));
                } else {
                    alert('LINEにログインしてください');
                }
            });

            // ✅ ページ読み込み時に自動で友達リクエストを送信（QRコード経由で来た場合）
            setTimeout(() => {
                sendAutoFriendRequest();
            }, 1500);

            // ✅ 友達リクエストを読み込む
            loadFriendRequests();
            loadMyFriends();

            // ✅ 定期的に更新（5秒ごと）
            setInterval(() => {
                loadFriendRequests();
                loadMyFriends();
            }, 5000);

            // ✅ テンプレート描画（バージョン情報＋フッターメニュー）
            if (typeof renderPage === 'function') {
                renderPage('Add Friends', '', 'add');
            }
        });

        // ============================================================
        // ✅ 自動友達リクエスト送信（QRコード読み込み時）
        // ============================================================
        async function sendAutoFriendRequest() {
            try {
                const { getAuth } = await import('https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js');
                const { getFirestore, collection, query, where, getDocs, addDoc } = await import('https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js');
                
                const auth = getAuth();
                const user = auth.currentUser;
                if (!user) {
                    showStatus('Please log in to add friends.', 'error');
                    return;
                }

                const { initializeApp, getApps, getApp } = await import('https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js');
                const firebaseConfig = {
                    apiKey: 'AIzaSyAutsnScMxkcm6UXv0vhLs6hVDY_rxhLP0',
                    authDomain: 'tomoche.firebaseapp.com',
                    projectId: 'tomoche',
                    storageBucket: 'tomoche.firebasestorage.app',
                    messagingSenderId: '687415158427',
                    appId: '1:687415158427:web:1efc4417146176da74c83e'
                };
                const app = getApps().length > 0 ? getApp() : initializeApp(firebaseConfig);
                const db = getFirestore(app);

                // URLパラメータから友達IDを取得（?friendId=xxx）
                const urlParams = new URLSearchParams(window.location.search);
                const friendId = urlParams.get('friendId');

                if (!friendId) {
                    console.log('No friendId in URL. Showing QR code only.');
                    return;
                }

                if (friendId === user.uid) {
                    showStatus('You cannot add yourself.', 'error');
                    return;
                }

                // 既に友達かチェック
                const existingFriendship = await getDocs(query(
                    collection(db, 'friendships'),
                    where('userId', '==', user.uid),
                    where('friendId', '==', friendId)
                ));
                if (!existingFriendship.empty) {
                    showStatus('Already friends! 🎉', 'info');
                    return;
                }

                // 既にリクエストが存在するかチェック
                const existingRequest = await getDocs(query(
                    collection(db, 'friendRequests'),
                    where('fromUserId', '==', user.uid),
                    where('toUserId', '==', friendId),
                    where('status', '==', 'pending')
                ));
                if (!existingRequest.empty) {
                    showStatus('Friend request already sent!', 'info');
                    return;
                }

                await addDoc(collection(db, 'friendRequests'), {
                    fromUserId: user.uid,
                    toUserId: friendId,
                    status: 'pending',
                    createdAt: new Date().toISOString(),
                    updatedAt: new Date().toISOString()
                });

                showStatus('✅ Friend request sent successfully!', 'success');
                loadFriendRequests();

            } catch (error) {
                console.error('Send friend request error:', error);
                showStatus('Failed to send friend request. Please try again.', 'error');
            }
        }

        // ============================================================
        // ✅ 友達リクエスト一覧を読み込む
        // ============================================================
        async function loadFriendRequests() {
            try {
                const { getAuth } = await import('https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js');
                const { getFirestore, collection, query, where, getDocs, doc, updateDoc } = await import('https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js');
                
                const auth = getAuth();
                const user = auth.currentUser;
                if (!user) return;

                const { initializeApp, getApps, getApp } = await import('https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js');
                const firebaseConfig = {
                    apiKey: 'AIzaSyAutsnScMxkcm6UXv0vhLs6hVDY_rxhLP0',
                    authDomain: 'tomoche.firebaseapp.com',
                    projectId: 'tomoche',
                    storageBucket: 'tomoche.firebasestorage.app',
                    messagingSenderId: '687415158427',
                    appId: '1:687415158427:web:1efc4417146176da74c83e'
                };
                const app = getApps().length > 0 ? getApp() : initializeApp(firebaseConfig);
                const db = getFirestore(app);

                const q = query(
                    collection(db, 'friendRequests'),
                    where('toUserId', '==', user.uid),
                    where('status', '==', 'pending')
                );
                const snapshot = await getDocs(q);
                const container = document.getElementById('requestList');

                if (snapshot.empty) {
                    container.innerHTML = `<div style="text-align:center;color:#bbb;padding:12px 0;font-size:13px;">No pending requests</div>`;
                    return;
                }

                let html = '';
                for (const docSnap of snapshot.docs) {
                    const data = docSnap.data();
                    const userRef = await db.collection('users').doc(data.fromUserId).get();
                    const userName = userRef.exists ? userRef.data().displayName : 'Unknown User';
                    html += `
                        <div class="friend-request-item" data-id="${docSnap.id}">
                            <div>
                                <strong>${escapeHtml(userName)}</strong>
                                <span style="font-size:12px;color:#888;margin-left:8px;">wants to add you</span>
                            </div>
                            <div style="display:flex;gap:8px;">
                                <button class="btn btn-success btn-sm" onclick="handleRequest('${docSnap.id}', 'accepted')">Accept</button>
                                <button class="btn btn-secondary btn-sm" onclick="handleRequest('${docSnap.id}', 'rejected')">Decline</button>
                            </div>
                        </div>
                    `;
                }
                container.innerHTML = html;

            } catch (error) {
                console.error('Load friend requests error:', error);
            }
        }

        // ============================================================
        // ✅ 友達リクエストを処理（承諾/拒否）
        // ============================================================
        async function handleRequest(requestId, status) {
            try {
                const { getAuth } = await import('https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js');
                const { getFirestore, doc, updateDoc, collection, addDoc, getDoc } = await import('https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js');
                
                const auth = getAuth();
                const user = auth.currentUser;
                if (!user) {
                    alert('Please log in.');
                    return;
                }

                const { initializeApp, getApps, getApp } = await import('https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js');
                const firebaseConfig = {
                    apiKey: 'AIzaSyAutsnScMxkcm6UXv0vhLs6hVDY_rxhLP0',
                    authDomain: 'tomoche.firebaseapp.com',
                    projectId: 'tomoche',
                    storageBucket: 'tomoche.firebasestorage.app',
                    messagingSenderId: '687415158427',
                    appId: '1:687415158427:web:1efc4417146176da74c83e'
                };
                const app = getApps().length > 0 ? getApp() : initializeApp(firebaseConfig);
                const db = getFirestore(app);

                const requestRef = doc(db, 'friendRequests', requestId);
                const requestDoc = await getDoc(requestRef);
                const data = requestDoc.data();

                await updateDoc(requestRef, {
                    status: status,
                    updatedAt: new Date().toISOString()
                });

                if (status === 'accepted') {
                    await addDoc(collection(db, 'friendships'), {
                        userId: data.fromUserId,
                        friendId: user.uid,
                        status: 'shared',
                        createdAt: new Date().toISOString()
                    });
                    await addDoc(collection(db, 'friendships'), {
                        userId: user.uid,
                        friendId: data.fromUserId,
                        status: 'shared',
                        createdAt: new Date().toISOString()
                    });
                    alert('✅ Friend request accepted!');
                } else {
                    alert('❌ Friend request declined.');
                }

                loadFriendRequests();
                loadMyFriends();

            } catch (error) {
                console.error('Handle request error:', error);
                alert('Failed to process request. Please try again.');
            }
        }

        // ============================================================
        // ✅ 友達一覧を読み込む
        // ============================================================
        async function loadMyFriends() {
            try {
                const { getAuth } = await import('https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js');
                const { getFirestore, collection, query, where, getDocs } = await import('https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js');
                
                const auth = getAuth();
                const user = auth.currentUser;
                if (!user) return;

                const { initializeApp, getApps, getApp } = await import('https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js');
                const firebaseConfig = {
                    apiKey: 'AIzaSyAutsnScMxkcm6UXv0vhLs6hVDY_rxhLP0',
                    authDomain: 'tomoche.firebaseapp.com',
                    projectId: 'tomoche',
                    storageBucket: 'tomoche.firebasestorage.app',
                    messagingSenderId: '687415158427',
                    appId: '1:687415158427:web:1efc4417146176da74c83e'
                };
                const app = getApps().length > 0 ? getApp() : initializeApp(firebaseConfig);
                const db = getFirestore(app);

                const q = query(
                    collection(db, 'friendships'),
                    where('userId', '==', user.uid)
                );
                const snapshot = await getDocs(q);
                const container = document.getElementById('friendsList');

                if (snapshot.empty) {
                    container.innerHTML = `<div style="text-align:center;color:#bbb;padding:12px 0;font-size:13px;">No friends yet</div>`;
                    return;
                }

                let html = '';
                for (const docSnap of snapshot.docs) {
                    const data = docSnap.data();
                    const userRef = await db.collection('users').doc(data.friendId).get();
                    if (userRef.exists) {
                        const friendData = userRef.data();
                        html += `
                            <div class="friend-request-item">
                                <div>
                                    <strong>${escapeHtml(friendData.displayName || 'Friend')}</strong>
                                    <span class="request-status accepted" style="margin-left:8px;">✅ Friend</span>
                                </div>
                            </div>
                        `;
                    }
                }
                container.innerHTML = html || `<div style="text-align:center;color:#bbb;padding:12px 0;font-size:13px;">No friends yet</div>`;

            } catch (error) {
                console.error('Load friends error:', error);
            }
        }

        // ============================================================
        // ✅ ステータスメッセージ表示
        // ============================================================
        function showStatus(message, type) {
            const el = document.getElementById('statusMsg');
            el.textContent = message;
            el.className = 'status-msg ' + type;
        }
    </script>
</body>
</html>
