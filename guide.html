<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Guide - Tomosche</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://static.line-scdn.net/liff/edge/2.1/sdk.js"></script>
    <style>
        .guide-item { padding: 14px 0; border-bottom: 1px solid #f0f4f8; }
        .guide-item:last-child { border-bottom: none; }
        .guide-icon { font-size: 28px; margin-right: 14px; }
    </style>
</head>
<body>
    <div id="app">
        <div class="container py-3">
            <div class="d-flex align-items-center mb-3">
                <button class="back-btn" onclick="history.back()"><i class="bi bi-arrow-left"></i></button>
                <h1 class="page-title">Guide</h1>
            </div>
            <div style="background:white;border-radius:16px;padding:20px;border:1px solid #f0f4f8;">
                <div class="guide-item">
                    <div class="d-flex align-items-center">
                        <span class="guide-icon">📱</span>
                        <div><strong>Add Friends</strong><div style="font-size:13px;color:#888;">Scan QR codes to connect with friends</div></div>
                    </div>
                </div>
                <div class="guide-item">
                    <div class="d-flex align-items-center">
                        <span class="guide-icon">📅</span>
                        <div><strong>Share Calendar</strong><div style="font-size:13px;color:#888;">Share your schedule with friends</div></div>
                    </div>
                </div>
                <div class="guide-item">
                    <div class="d-flex align-items-center">
                        <span class="guide-icon">⏰</span>
                        <div><strong>Plan Together</strong><div style="font-size:13px;color:#888;">Find mutual free time and make plans</div></div>
                    </div>
                </div>
                <div class="guide-item">
                    <div class="d-flex align-items-center">
                        <span class="guide-icon">🔔</span>
                        <div><strong>Get Notified</strong><div style="font-size:13px;color:#888;">Receive updates when friends respond</div></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/app.js"></script>
    <script src="js/template.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            renderPage('Guide', '');
        });
    </script>
    <div style="text-align:center;padding:4px 0 16px 0;font-size:10px;color:#ccc;"><span id="versionDisplay"></span></div>
</body>
</html>
