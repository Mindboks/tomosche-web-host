<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Tomosche</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://static.line-scdn.net/liff/edge/2.1/sdk.js"></script>
    <script src="js/auth-guard.js"></script>
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
    <script src="js/escape.js"></script>
    <script src="js/template.js"></script>
    <style>
        .image-wrapper { position: relative; width: 100%; border-radius: 20px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.06); margin: 4px 0 0 0; }
        .image-wrapper img { width: 100%; height: auto; display: block; }
        .image-date { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); background: rgba(255,255,255,0.92); backdrop-filter: blur(6px); padding: 6px 18px; border-radius: 999px; font-size: clamp(11px, 3vw, 14px); font-weight: 600; color: #333; box-shadow: 0 2px 8px rgba(0,0,0,0.04); border: 1px solid rgba(255,255,255,0.6); white-space: nowrap; z-index: 5; }
        .image-search { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); width: 88%; max-width: 360px; z-index: 5; }
        .image-search .search-box { display: flex; align-items: center; background: rgba(255,255,255,0.95); backdrop-filter: blur(6px); border-radius: 12px; padding: 10px 16px; gap: 10px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); border: 1px solid rgba(255,255,255,0.6); }
        .image-search .search-box i { color: #999; font-size: 16px; }
        .image-search .search-box input { border: none; background: none; outline: none; flex: 1; font-size: clamp(12px, 2.5vw, 14px); color: #333; }
        .image-search .search-box input::placeholder { color: #bbb; }

        .avatars { display: flex; gap: 12px; flex-wrap: wrap; padding: 12px 0 8px 0; justify-content: flex-start; }
        .avatar-item { display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #333; width: 56px; cursor: pointer; }
        .avatar-circle { width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: clamp(14px, 2.5vw, 16px); font-weight: 600; color: #333; border: 2px solid white; box-shadow: 0 2px 8px rgba(0,0,0,0.06); background: #e8f5e9; }
        .avatar-circle img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
        .avatar-add { border: 2px dashed #ccc; color: #999; background: #f0f4f8; font-size: 20px; }
        .avatar-add:hover { border-color: #06C755; color: #06C755; }
        .avatar-name { font-size: clamp(9px, 2vw, 10px); color: #888; text-align: center; max-width: 56px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .avatar-empty { text-align: center; color: #bbb; padding: 12px 0; font-size: 14px; width: 100%; }
        .avatar-empty i { font-size: 24px; display: block; margin-bottom: 4px; }

        /* Upcoming */
        .today-card { background: white; border-radius: 16px; padding: 16px; border: 1px solid #f0f4f8; margin-top: 8px; }
        .today-header { display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: clamp(13px, 2.5vw, 14px); color: #333; margin-bottom: 8px; }
        .today-header i { color: #06C755; margin-right: 6px; }
        .today-more { font-size: clamp(11px, 2vw, 12px); font-weight: 400; color: #06C755; text-decoration: none; white-space: nowrap; }
        .today-item { display: flex; align-items: center; padding: 8px 0; border-bottom: 1px solid #f0f4f8; gap: 10px; font-size: clamp(12px, 2.2vw, 13px); white-space: nowrap; }
        .today-item:last-child { border-bottom: none; }
        .today-time { color: #06C755; font-weight: 600; min-width: 44px; font-size: clamp(11px, 2vw, 12px); }
        .today-title { flex: 1; color: #333; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .today-person { color: #888; background: #f0f4f8; padding: 2px 10px; border-radius: 999px; font-size: clamp(10px, 1.8vw, 11px); white-space: nowrap; }

        /* リクエスト一覧 */
        .requests-card { background: white; border-radius: 16px; padding: 16px; border: 1px solid #f0f4f8; margin-top: 12px; }
        .requests-header { display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: clamp(13px, 2.5vw, 14px); color: #333; margin-bottom: 8px; }
        .requests-header i { color: #ff9800; margin-right: 6px; }
        .request-item-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            background: #f8f9fa;
            border-radius: 12px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid #e9ecef;
            flex-wrap: wrap;
            gap: 6px;
        }
        .request-item-card:hover { background: #f0f4f8; border-color: #ff9800; }
        .request-item-card:last-child { margin-bottom: 0; }
        .request-item-card .req-info {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 120px;
        }
        .request-item-card .req-badge {
            font-size: 10px;
            padding: 2px 10px;
            border-radius: 999px;
            font-weight: 600;
            background: #fff3e0;
            color: #e65100;
        }
        .request-item-card .req-date {
            font-size: 12px;
            color: #888;
            white-space: nowrap;
        }
        .request-item-card .req-title {
            font-size: 14px;
            font-weight: 500;
            color: #333;
        }
        .request-item-card .req-from {
            font-size: 12px;
            color: #888;
        }
        .request-empty {
            text-align: center;
            color: #bbb;
            padding: 12px 0;
            font-size: 13px;
        }

        /* リクエストモーダル */
        .request-modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .request-modal-overlay.active { display: flex; }
        .request-modal {
            background: white;
            border-radius: 24px;
            max-width: 440px;
            width: 100%;
            padding: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .request-modal h4 { font-weight: 700; margin-bottom: 4px; }
        .request-modal .subtitle { color: #888; font-size: 14px; margin-bottom: 16px; }
        .request-modal .detail-row { display: flex; gap: 8px; padding: 6px 0; font-size: 14px; }
        .request-modal .detail-row .label { color: #888; min-width: 60px; }
        .request-modal .detail-row .value { color: #333; font-weight: 500; }
        .request-modal textarea {
            width: 100%;
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 14px;
            outline: none;
            resize: vertical;
            margin-top: 12px;
            font-family: inherit;
        }
        .request-modal textarea:focus { border-color: #06C755; }
        .request-modal .modal-actions { display: flex; gap: 12px; margin-top: 16px; }
        .request-modal .modal-actions button {
            flex: 1;
            padding: 12px;
            border-radius: 999px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            font-size: 15px;
        }
        .request-modal .btn-approve { background: #06C755; color: white; }
        .request-modal .btn-approve:hover { background: #049a44; }
        .request-modal .btn-reject { background: #e53935; color: white; }
        .request-modal .btn-reject:hover { background: #c62828; }
        .request-modal .btn-close-modal { background: #f0f4f8; color: #666; }

        @media (max-width: 480px) {
            .request-item-card { flex-direction: column; align-items: stretch; }
            .request-item-card .req-info { flex-wrap: wrap; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div id="indexContent">
            <div class="image-wrapper">
                <img src="assets/images/toppageTmocha.png" alt="Tomosche" />
                <div class="image-date" id="dateDisplay">Loading...</div>
                <div class="image-search">
                    <div class="search-box">
                        <i class="bi bi-search"></i>
                        <input type="text" id="globalSearch" placeholder="Search events, friends, or dates..." />
                    </div>
                </div>
            </div>
            <div class="avatars" id="avatars"></div>
            
            <!-- ✅ リクエスト一覧（上） -->
            <div class="requests-card" id="requestsCard">
                <div class="requests-header">
                    <span><i class="bi bi-inbox"></i> Friend Requests</span>
                    <span id="requestBadgeHome" style="background:#ff9800;color:white;border-radius:50%;padding:0 8px;font-size:12px;display:none;">0</span>
                </div>
                <div id="requestListHome">
                    <div class="request-empty">📭 No pending requests</div>
                </div>
            </div>

            <!-- ✅ Upcoming セクション（下） -->
            <div class="today-card">
                <div class="today-header">
                    <span><i class="bi bi-clock-history"></i> Upcoming</span>
                    <a href="calendar.html" class="today-more">See All →</a>
                </div>
                <div id="todayList">
                    <div style="text-align:center;color:#bbb;padding:16px 0;font-size:14px;">📭 No upcoming events</div>
                </div>
            </div>
        </div>
    </div>

    <!-- リクエスト詳細モーダル -->
    <div class="request-modal-overlay" id="requestModal">
        <div class="request-modal">
            <h4 id="reqModalTitle">📩 Request</h4>
            <div class="subtitle" id="reqModalSubtitle">Review this friend request</div>
            <div class="detail-row"><span class="label">From</span><span class="value" id="reqModalFrom">-</span></div>
            <div class="detail-row"><span class="label">Title</span><span class="value" id="reqModalTitleText">-</span></div>
            <div class="detail-row"><span class="label">Date</span><span class="value" id="reqModalDate">-</span></div>
            <div class="detail-row"><span class="label">Note</span><span class="value" id="reqModalNote">-</span></div>
            <textarea id="reqModalComment" placeholder="Add a comment (optional)..." rows="2"></textarea>
            <div id="reqModalStatus" style="font-size:13px;text-align:center;margin-top:8px;display:none;"></div>
            <div class="modal-actions">
                <button class="btn-reject" id="reqModalRejectBtn">Decline</button>
                <button class="btn-approve" id="reqModalApproveBtn">Accept</button>
            </div>
            <button class="btn-close-modal" id="reqModalCloseBtn" style="width:100%;margin-top:8px;">Close</button>
        </div>
    </div>

    <script>
        const now = new Date();
        const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        document.getElementById('dateDisplay').textContent =
            `Today・${monthNames[now.getMonth()]} ${now.getDate()}  ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

        // ============================================================
        // 時間フォーマット（template.js の関数を使用）
        // ============================================================
        function formatTimeDisplaySimple(timeStr) {
            if (!timeStr) return '--:--';
            const parts = timeStr.split(':');
            if (parts.length < 2) return '--:--';
            let hour = parseInt(parts[0], 10);
            const minute = parts[1] || '00';
            if (isNaN(hour)) return '--:--';
            const ampm = hour >= 12 ? 'PM' : 'AM';
            hour = hour % 12;
            if (hour === 0) hour = 12;
            return `${hour}:${minute} ${ampm}`;
        }

        // ============================================================
        // グローバル変数
        // ============================================================
        let currentRequests = [];
        let selectedRequestId = null;

        // ============================================================
        // 友達一覧を読み込む（名前表示修正版）
        // ============================================================
        async function loadFriends() {
            const container = document.getElementById('avatars');
            try {
                console.log('🔍 loadFriends 開始');
                
                if (window.liffReadyPromise) {
                    await window.liffReadyPromise;
                }

                const { getAuth } = await import('https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js');
                const { getFirestore, collection, query, where, getDocs, doc, getDoc } = await import('https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js');
                
                const auth = getAuth();
                const user = auth.currentUser;
                console.log('👤 現在のユーザー:', user ? user.uid : '未ログイン');
                
                if (!user) {
                    container.innerHTML = `<div class="avatar-empty"><i class="bi bi-people"></i>Please log in to see friends</div>`;
                    return;
                }

                const { initializeApp, getApps, getApp } = await import('https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js');
                const firebaseConfig = {
                    apiKey: 'AIzaSyAutsnScMxkcm6UXv0vhLs6hVDY_rxhLP0',
                    authDomain: 'tomoche.firebaseapp.com',
                    projectId: 'tomoche',
                    storageBucket: 'tomoche.firebasestorage.app',
                    messagingSenderId: '687415158427',
                    appId: '1:687415158427:web:1efc4417146176da74c83e'
                };
                const app = getApps().length > 0 ? getApp() : initializeApp(firebaseConfig);
                const db = getFirestore(app);

                const q = query(collection(db, 'friendships'), where('userId', '==', user.uid));
                const snapshot = await getDocs(q);
                console.log('📊 friendships 件数:', snapshot.size);
                
                if (snapshot.empty) {
                    container.innerHTML = `<div class="avatar-empty"><i class="bi bi-people"></i>No friends added yet</div>`;
                    return;
                }

                const friends = [];
                for (const docSnap of snapshot.docs) {
                    const data = docSnap.data();
                    const friendId = data.friendId;
                    
                    try {
                        const friendRef = doc(db, 'users', friendId);
                        const friendSnap = await getDoc(friendRef);
                        
                        if (friendSnap.exists()) {
                            const friendData = friendSnap.data();
                            let displayName = friendData.displayName || 'Friend';
                            if (friendData.lineDisplayName) {
                                displayName = friendData.lineDisplayName;
                            }
                            friends.push({
                                id: friendId,
                                name: displayName,
                                initial: displayName.charAt(0).toUpperCase(),
                                pictureUrl: friendData.pictureUrl || null
                            });
                        } else {
                            console.warn('⚠️ 友達のユーザー情報なし:', friendId);
                            friends.push({
                                id: friendId,
                                name: 'Unknown',
                                initial: '?',
                                pictureUrl: null
                            });
                        }
                    } catch (err) {
                        console.error('❌ 友達情報取得エラー:', err);
                        friends.push({
                            id: friendId,
                            name: 'Friend',
                            initial: 'F',
                            pictureUrl: null
                        });
                    }
                }

                console.log('👥 友達リスト:', friends);

                if (friends.length === 0) {
                    container.innerHTML = `<div class="avatar-empty"><i class="bi bi-people"></i>No friends added yet</div>`;
                    return;
                }

                friends.sort((a, b) => a.name.localeCompare(b.name));

                container.innerHTML = friends.map(fr => {
                    const avatarContent = fr.pictureUrl 
                        ? `<img src="${fr.pictureUrl}" alt="${fr.name}" />` 
                        : `<span style="font-size:18px;font-weight:700;">${escapeHtml(fr.initial)}</span>`;
                    
                    const displayName = fr.name.length > 8 ? fr.name.substring(0, 8) + '...' : fr.name;
                    
                    return `
                        <div class="avatar-item" onclick="alert('Friend: ${escapeHtml(fr.name)}')">
                            <div class="avatar-circle" style="background:#e8f5e9;">${avatarContent}</div>
                            <span class="avatar-name">${escapeHtml(displayName)}</span>
                        </div>
                    `;
                }).join('');
                
                container.innerHTML += `
                    <a href="add.html" class="avatar-item">
                        <div class="avatar-circle avatar-add"><i class="bi bi-plus"></i></div>
                        <span class="avatar-name">Add</span>
                    </a>
                `;

            } catch (error) {
                console.error('❌ Load friends error:', error);
                container.innerHTML = `<div class="avatar-empty"><i class="bi bi-people"></i>Failed to load friends<br><span style="font-size:11px;color:#ccc;">${error.message}</span></div>`;
            }
        }

        // ============================================================
        // リクエスト一覧を読み込む（pending のみ）
        // ============================================================
        async function loadRequests() {
            try {
                if (window.liffReadyPromise) {
                    await window.liffReadyPromise;
                }

                const { getAuth } = await import('https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js');
                const { getFirestore, collection, query, where, getDocs } = await import('https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js');
                const { getApp } = await import('https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js');

                const app = getApp();
                const auth = getAuth(app);
                const user = auth.currentUser;
                if (!user) return;

                const db = getFirestore(app);

                // ★ pending のみ取得
                const pendingQuery = query(
                    collection(db, 'friendEvents'),
                    where('toUserId', '==', user.uid),
                    where('status', '==', 'pending')
                );
                const pendingSnapshot = await getDocs(pendingQuery);
                
                const requests = [];
                
                pendingSnapshot.forEach(doc => {
                    const data = doc.data();
                    requests.push({
                        id: doc.id,
                        fromUserId: data.fromUserId,
                        fromUserName: data.fromUserName || 'Friend',
                        date: data.date,
                        time: data.time,
                        title: data.title,
                        note: data.note || '',
                        status: data.status,
                        createdAt: data.createdAt,
                        isCancel: data.title && data.title.startsWith('[CANCEL]')
                    });
                });

                requests.sort((a, b) => {
                    return new Date(b.createdAt) - new Date(a.createdAt);
                });

                currentRequests = requests;
                renderRequests(requests);

            } catch (error) {
                console.error('Load requests error:', error);
            }
        }

        // ============================================================
        // リクエスト一覧を表示（pending のみ）
        // ============================================================
        function renderRequests(requests) {
            const container = document.getElementById('requestListHome');
            const badge = document.getElementById('requestBadgeHome');

            // ★ pending のみ表示（承認済みは Upcoming へ移動）
            const pendingOnly = requests.filter(r => r.status === 'pending');

            if (pendingOnly.length === 0) {
                container.innerHTML = `<div class="request-empty">📭 No pending requests</div>`;
                badge.style.display = 'none';
                return;
            }

            badge.style.display = 'inline';
            badge.textContent = pendingOnly.length;

            let html = '';
            html += `<div style="font-weight:600;font-size:13px;color:#333;margin-bottom:6px;">📩 Pending</div>`;
            html += pendingOnly.map(req => {
                const displayTitle = req.title.replace('[CANCEL] ', '').trim();
                const isCancel = req.isCancel;
                return `
                    <div class="request-item-card" onclick="openRequestModal('${req.id}')">
                        <div class="req-info">
                            <span class="req-badge">${isCancel ? '❌ Cancel' : '📩 New'}</span>
                            <span class="req-title">${escapeHtml(displayTitle)}</span>
                        </div>
                        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
                            <span class="req-from">👤 ${escapeHtml(req.fromUserName)}</span>
                            <span class="req-date">📅 ${req.date}</span>
                        </div>
                    </div>
                `;
            }).join('');

            container.innerHTML = html;
        }

        // ============================================================
        // リクエストモーダル
        // ============================================================
        function openRequestModal(requestId) {
            const req = currentRequests.find(r => r.id === requestId);
            if (!req) return;

            selectedRequestId = requestId;
            const isCancel = req.title.startsWith('[CANCEL]');
            const displayTitle = req.title.replace('[CANCEL] ', '').trim();

            document.getElementById('reqModalTitle').textContent = isCancel ? '❌ Cancellation Request' : '📩 Friend Request';
            document.getElementById('reqModalSubtitle').textContent = isCancel ? 'Review this cancellation request' : 'Review this event request';
            document.getElementById('reqModalFrom').textContent = req.fromUserName || 'Friend';
            document.getElementById('reqModalTitleText').textContent = displayTitle;
            document.getElementById('reqModalDate').textContent = `${req.date} ${req.time || ''}`;
            document.getElementById('reqModalNote').textContent = req.note || '(No note)';
            document.getElementById('reqModalComment').value = '';
            document.getElementById('reqModalStatus').style.display = 'none';

            if (isCancel) {
                document.getElementById('reqModalApproveBtn').textContent = 'Accept Cancellation';
                document.getElementById('reqModalApproveBtn').style.background = '#ff9800';
            } else {
                document.getElementById('reqModalApproveBtn').textContent = 'Accept';
                document.getElementById('reqModalApproveBtn').style.background = '#06C755';
            }

            document.getElementById('requestModal').classList.add('active');
        }

        function closeRequestModal() {
            document.getElementById('requestModal').classList.remove('active');
            selectedRequestId = null;
        }

        // ============================================================
        // リクエスト処理（承認/拒否）
        // ============================================================
        async function processRequest(status) {
            if (!selectedRequestId) return;

            const req = currentRequests.find(r => r.id === selectedRequestId);
            if (!req) return;

            const comment = document.getElementById('reqModalComment').value.trim();
            const statusEl = document.getElementById('reqModalStatus');
            statusEl.style.display = 'block';
            statusEl.textContent = '⏳ Processing...';
            statusEl.style.color = '#888';

            try {
                const { getAuth } = await import('https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js');
                const { getFirestore, doc, updateDoc, collection, addDoc } = await import('https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js');
                const { getApp } = await import('https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js');

                const app = getApp();
                const auth = getAuth(app);
                const user = auth.currentUser;
                if (!user) {
                    statusEl.textContent = '❌ Please log in.';
                    statusEl.style.color = '#e53935';
                    return;
                }

                const db = getFirestore(app);
                const requestRef = doc(db, 'friendEvents', selectedRequestId);
                const isCancel = req.title.startsWith('[CANCEL]');

                if (status === 'approved') {
                    if (isCancel) {
                        // キャンセル承認
                        await updateDoc(requestRef, {
                            status: 'approved',
                            updatedAt: new Date().toISOString()
                        });
                        statusEl.textContent = '✅ Cancellation accepted.';
                        statusEl.style.color = '#06C755';
                    } else {
                        // 通常承認
                        await updateDoc(requestRef, {
                            status: 'confirmed',
                            updatedAt: new Date().toISOString()
                        });

                        // 自分のカレンダーに追加
                        await addDoc(collection(db, 'events'), {
                            userId: user.uid,
                            date: req.date,
                            time: req.time,
                            title: req.title,
                            person: req.fromUserName || 'Friend',
                            type: 'shared',
                            status: 'confirmed',
                            sharedWith: req.fromUserId,
                            role: 'acceptor',
                            createdAt: new Date().toISOString(),
                            updatedAt: new Date().toISOString()
                        });

                        // 友達のカレンダーに追加
                        const myDisplayName = window.currentUser?.displayName || 'Me';
                        await addDoc(collection(db, 'events'), {
                            userId: req.fromUserId,
                            date: req.date,
                            time: req.time,
                            title: `[With ${myDisplayName}] ${req.title}`,
                            person: myDisplayName,
                            type: 'shared',
                            status: 'confirmed',
                            sharedWith: user.uid,
                            role: 'requester',
                            createdAt: new Date().toISOString(),
                            updatedAt: new Date().toISOString()
                        });

                        statusEl.textContent = `✅ Request accepted! Added to both calendars.`;
                        statusEl.style.color = '#06C755';
                    }
                } else {
                    // ★ 拒否（Decline）：ステータスを rejected に更新するだけ
                    await updateDoc(requestRef, {
                        status: 'rejected',
                        updatedAt: new Date().toISOString()
                    });
                    
                    if (comment) {
                        console.log('📝 拒否コメント:', comment);
                    }
                    
                    statusEl.textContent = '❌ Request declined.';
                    statusEl.style.color = '#e53935';
                }

                setTimeout(() => {
                    closeRequestModal();
                    loadRequests();
                    loadUpcomingEvents();
                }, 1500);

            } catch (error) {
                console.error('Process request error:', error);
                statusEl.textContent = `❌ Failed: ${error.message}`;
                statusEl.style.color = '#e53935';
            }
        }

        // ============================================================
        // Upcoming 予定を読み込む（自分の予定 + 承認済み共有イベント）
        // ============================================================
        async function loadUpcomingEvents() {
            const container = document.getElementById('todayList');
            try {
                if (window.liffReadyPromise) {
                    await window.liffReadyPromise;
                }

                const { getAuth } = await import('https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js');
                const { getFirestore, collection, query, where, getDocs } = await import('https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js');
                const { getApp } = await import('https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js');

                const app = getApp();
                const auth = getAuth(app);
                const user = auth.currentUser;
                if (!user) {
                    container.innerHTML = `<div style="text-align:center;color:#bbb;padding:16px 0;font-size:14px;">Please log in</div>`;
                    return;
                }

                const db = getFirestore(app);
                const today = new Date().toISOString().split('T')[0];

                // ★ 自分の予定（userId == user.uid）
                const myEventsQuery = query(
                    collection(db, 'events'),
                    where('userId', '==', user.uid),
                    where('date', '>=', today)
                );
                const mySnapshot = await getDocs(myEventsQuery);

                // ★ 承認済みの共有イベント（sharedWith == user.uid かつ status == 'confirmed'）
                const sharedEventsQuery = query(
                    collection(db, 'events'),
                    where('sharedWith', '==', user.uid),
                    where('date', '>=', today)
                );
                const sharedSnapshot = await getDocs(sharedEventsQuery);

                const events = [];
                const eventIds = new Set();

                // 自分の予定を追加
                mySnapshot.forEach(doc => {
                    const data = doc.data();
                    const id = doc.id;
                    if (!eventIds.has(id)) {
                        eventIds.add(id);
                        if (data.type === 'own' || data.type === 'shared') {
                            let displayTitle = data.title || 'Untitled';
                            displayTitle = displayTitle.replace(/^\[With\s+.+?\]\s*/, '').trim();
                            events.push({
                                id: id,
                                title: displayTitle,
                                date: data.date,
                                time: data.time || '--:--',
                                person: data.person || 'Me'
                            });
                        }
                    }
                });

                // ★ 承認済みの共有イベントを追加（重複防止）
                sharedSnapshot.forEach(doc => {
                    const data = doc.data();
                    const id = doc.id;
                    if (!eventIds.has(id)) {
                        eventIds.add(id);
                        let displayTitle = data.title || 'Untitled';
                        displayTitle = displayTitle.replace(/^\[With\s+.+?\]\s*/, '').trim();
                        events.push({
                            id: id,
                            title: displayTitle,
                            date: data.date,
                            time: data.time || '--:--',
                            person: data.person || 'Friend'
                        });
                    }
                });

                events.sort((a, b) => {
                    if (a.date !== b.date) return a.date.localeCompare(b.date);
                    return a.time.localeCompare(b.time);
                });

                const displayEvents = events.slice(0, 5);

                if (displayEvents.length === 0) {
                    container.innerHTML = `<div style="text-align:center;color:#bbb;padding:16px 0;font-size:14px;">📭 No upcoming events</div>`;
                    return;
                }

                container.innerHTML = displayEvents.map(e => {
                    const displayTime = formatTimeDisplaySimple(e.time);
                    return `
                        <div class="today-item">
                            <span class="today-time">${displayTime}</span>
                            <span class="today-title">${escapeHtml(e.title)}</span>
                            <span class="today-person">👤 ${escapeHtml(e.person)}</span>
                        </div>
                    `;
                }).join('');

                if (events.length > 5) {
                    container.innerHTML += `<div style="text-align:right;font-size:12px;color:#999;padding-top:4px;">+ ${events.length - 5} more...</div>`;
                }

            } catch (error) {
                console.error('Load upcoming error:', error);
                container.innerHTML = `<div style="text-align:center;color:#bbb;padding:16px 0;font-size:14px;">Failed to load</div>`;
            }
        }

        // ============================================================
        // イベントリスナー
        // ============================================================
        document.getElementById('globalSearch').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const q = this.value.trim();
                if (q) alert(`🔍 Searching for "${q}" (coming soon)`);
            }
        });

        document.getElementById('reqModalApproveBtn').addEventListener('click', function() {
            processRequest('approved');
        });
        document.getElementById('reqModalRejectBtn').addEventListener('click', function() {
            processRequest('rejected');
        });
        document.getElementById('reqModalCloseBtn').addEventListener('click', closeRequestModal);
        document.getElementById('requestModal').addEventListener('click', function(e) {
            if (e.target === this) closeRequestModal();
        });

        document.addEventListener('DOMContentLoaded', function() {
            loadFriends();
            loadRequests();
            loadUpcomingEvents();
            setInterval(loadRequests, 60000);
            if (typeof renderPage === 'function') {
                renderPage('Tomosche', '', 'home');
            }
        });
    </script>
</body>
</html>
