<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Tomosche</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://static.line-scdn.net/liff/edge/2.1/sdk.js"></script>
    <script src="js/auth-guard.js"></script>
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
    <script src="js/escape.js"></script>
    <script src="js/template.js"></script>
    <style>
        .image-wrapper { position: relative; width: 100%; border-radius: 20px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.06); margin: 4px 0 0 0; }
        .image-wrapper img { width: 100%; height: auto; display: block; }
        .image-date { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); background: rgba(255,255,255,0.92); backdrop-filter: blur(6px); padding: 6px 18px; border-radius: 999px; font-size: clamp(11px, 3vw, 14px); font-weight: 600; color: #333; box-shadow: 0 2px 8px rgba(0,0,0,0.04); border: 1px solid rgba(255,255,255,0.6); white-space: nowrap; z-index: 5; }
        .image-search { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); width: 88%; max-width: 360px; z-index: 5; }
        .image-search .search-box { display: flex; align-items: center; background: rgba(255,255,255,0.95); backdrop-filter: blur(6px); border-radius: 12px; padding: 10px 16px; gap: 10px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); border: 1px solid rgba(255,255,255,0.6); }
        .image-search .search-box i { color: #999; font-size: 16px; }
        .image-search .search-box input { border: none; background: none; outline: none; flex: 1; font-size: clamp(12px, 2.5vw, 14px); color: #333; }
        .image-search .search-box input::placeholder { color: #bbb; }
        .avatars { display: flex; gap: 12px; flex-wrap: wrap; padding: 12px 0 8px 0; justify-content: flex-start; }
        .avatar-item { display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #333; width: 56px; cursor: pointer; }
        .avatar-circle { width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: clamp(14px, 2.5vw, 16px); font-weight: 600; color: #333; border: 2px solid white; box-shadow: 0 2px 8px rgba(0,0,0,0.06); background: #e8f5e9; }
        .avatar-add { border: 2px dashed #ccc; color: #999; background: #f0f4f8; font-size: 20px; }
        .avatar-add:hover { border-color: #06C755; color: #06C755; }
        .avatar-name { font-size: clamp(9px, 2vw, 10px); color: #888; text-align: center; max-width: 56px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .avatar-empty { text-align: center; color: #bbb; padding: 12px 0; font-size: 14px; width: 100%; }
        .avatar-empty i { font-size: 24px; display: block; margin-bottom: 4px; }
        .today-card { background: white; border-radius: 16px; padding: 16px; border: 1px solid #f0f4f8; margin-top: 8px; }
        .today-header { display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: clamp(13px, 2.5vw, 14px); color: #333; margin-bottom: 8px; }
        .today-header i { color: #06C755; margin-right: 6px; }
        .today-more { font-size: clamp(11px, 2vw, 12px); font-weight: 400; color: #06C755; text-decoration: none; white-space: nowrap; }
        .today-item { display: flex; align-items: center; padding: 8px 0; border-bottom: 1px solid #f0f4f8; gap: 10px; font-size: clamp(12px, 2.2vw, 13px); white-space: nowrap; }
        .today-item:last-child { border-bottom: none; }
        .today-time { color: #06C755; font-weight: 600; min-width: 44px; font-size: clamp(11px, 2vw, 12px); }
        .today-title { flex: 1; color: #333; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .today-person { color: #888; background: #f0f4f8; padding: 2px 10px; border-radius: 999px; font-size: clamp(10px, 1.8vw, 11px); white-space: nowrap; }
    </style>
</head>
<body>
    <div class="app-container">
        <div id="indexContent">
            <div class="image-wrapper">
                <img src="assets/images/toppageTmocha.png" alt="Tomosche" />
                <div class="image-date" id="dateDisplay">Loading...</div>
                <div class="image-search">
                    <div class="search-box">
                        <i class="bi bi-search"></i>
                        <input type="text" id="globalSearch" placeholder="Search events, friends, or dates..." />
                    </div>
                </div>
            </div>
            <div class="avatars" id="avatars"></div>
            <div class="today-card">
                <div class="today-header">
                    <span><i class="bi bi-clock-history"></i> Upcoming</span>
                    <a href="calendar.html" class="today-more">See All →</a>
                </div>
                <div id="todayList">
                    <div style="text-align:center;color:#bbb;padding:16px 0;font-size:14px;">📭 No upcoming events</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const now = new Date();
        const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        document.getElementById('dateDisplay').textContent =
            `Today・${monthNames[now.getMonth()]} ${now.getDate()}  ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

        // ============================================================
        // ✅ 友達一覧を Firestore から読み込む（Firestore v9 対応）
        // ============================================================
        async function loadFriends() {
            const container = document.getElementById('avatars');
            try {
                const { getAuth } = await import('https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js');
                const { getFirestore, collection, query, where, getDocs, doc, getDoc } = await import('https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js');
                
                const auth = getAuth();
                const user = auth.currentUser;
                if (!user) {
                    container.innerHTML = `<div class="avatar-empty"><i class="bi bi-people"></i>Please log in to see friends</div>`;
                    return;
                }

                const { initializeApp, getApps, getApp } = await import('https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js');
                const firebaseConfig = {
                    apiKey: 'AIzaSyAutsnScMxkcm6UXv0vhLs6hVDY_rxhLP0',
                    authDomain: 'tomoche.firebaseapp.com',
                    projectId: 'tomoche',
                    storageBucket: 'tomoche.firebasestorage.app',
                    messagingSenderId: '687415158427',
                    appId: '1:687415158427:web:1efc4417146176da74c83e'
                };
                const app = getApps().length > 0 ? getApp() : initializeApp(firebaseConfig);
                const db = getFirestore(app);

                // friendships から友達を取得
                const q = query(collection(db, 'friendships'), where('userId', '==', user.uid));
                const snapshot = await getDocs(q);
                
                if (snapshot.empty) {
                    container.innerHTML = `<div class="avatar-empty"><i class="bi bi-people"></i>No friends added yet</div>`;
                    return;
                }

                const friends = [];
                for (const docSnap of snapshot.docs) {
                    const data = docSnap.data();
                    // ✅ Firestore v9 の正しい書き方
                    const friendRef = doc(db, 'users', data.friendId);
                    const friendSnap = await getDoc(friendRef);
                    if (friendSnap.exists()) {
                        const friendData = friendSnap.data();
                        friends.push({
                            id: data.friendId,
                            name: friendData.displayName || 'Friend',
                            initial: (friendData.displayName || 'F')[0].toUpperCase(),
                            status: data.status || 'pending'
                        });
                    }
                }

                if (friends.length === 0) {
                    container.innerHTML = `<div class="avatar-empty"><i class="bi bi-people"></i>No friends added yet</div>`;
                    return;
                }

                container.innerHTML = friends.map(fr => `
                    <div class="avatar-item" onclick="alert('Friend: ${escapeHtml(fr.name)}')">
                        <div class="avatar-circle">${escapeHtml(fr.initial)}</div>
                        <span class="avatar-name">${escapeHtml(fr.name)}</span>
                    </div>
                `).join('');
                container.innerHTML += `<a href="add.html" class="avatar-item"><div class="avatar-circle avatar-add"><i class="bi bi-plus"></i></div><span class="avatar-name">Add</span></a>`;

                // ✅ 更新フラグをクリア
                localStorage.removeItem('tomosche_friends_updated');

            } catch (error) {
                console.error('Load friends error:', error);
                container.innerHTML = `<div class="avatar-empty"><i class="bi bi-people"></i>Failed to load friends</div>`;
            }
        }

        document.getElementById('globalSearch').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const q = this.value.trim();
                if (q) alert(`🔍 Searching for "${q}" (coming soon)`);
            }
        });

        document.addEventListener('DOMContentLoaded', function() {
            // ✅ 友達追加後に更新（localStorage フラグをチェック）
            const needsUpdate = localStorage.getItem('tomosche_friends_updated') === 'true';
            
            loadFriends();

            // ✅ 5秒ごとに自動更新（友達追加を検出）
            setInterval(() => {
                const shouldUpdate = localStorage.getItem('tomosche_friends_updated') === 'true';
                if (shouldUpdate) {
                    loadFriends();
                }
            }, 3000);

            if (typeof renderPage === 'function') {
                renderPage('Tomosche', '', 'home');
            }
        });
    </script>
</body>
</html>
